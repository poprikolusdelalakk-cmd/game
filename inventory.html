<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Мой Инвентарь</title>
    <style>
        body { background: #02040a; color: #fff; font-family: sans-serif; padding: 30px 20px; display: flex; align-items: center; justify-content: center; min-height: 100vh; }
        .box { background: rgba(14,22,47,0.85); border: 1px solid rgba(0,242,254,0.2); border-radius: 20px; padding: 30px; max-width: 400px; width: 100%; text-align: center; }
        .item-row { background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.08); padding: 12px; border-radius: 10px; margin-bottom: 8px; text-align: left; font-weight: bold; color: #00f2fe; }
        .btn-menu { display: block; background: #fff; color: #000; padding: 14px; border-radius: 12px; font-weight: bold; text-decoration: none; text-transform: uppercase; margin-top: 25px; }
    </style>
</head>
<body>
    <div class="box">
        <h2 style="margin-bottom:20px; letter-spacing:1px;">📦 ТВОЙ СКЛАД ОРУЖИЯ</h2>
        <div id="inv-list"><p style="color:#7f91a4;">Твой арсенал пока пуст...</p></div>
        <a href="index.html" class="btn-menu">В главное меню</a>
    </div>
    <script>
        var inv = JSON.parse(localStorage.getItem('fl_inventory_items')) || [];
        if (inv.length > 0) {
            var html = "";
            inv.forEach(function(item) {
                html += '<div class="item-row">' + item + '</div>';
            });
            document.getElementById('inv-list').innerHTML = html;
        }
    </script>
</body>
</html>
