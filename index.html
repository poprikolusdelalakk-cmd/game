<!DOCTYPE html>
<html lang="ru" translate="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fluent Messenger</title>
    <style>
        :root {
            --bg-color: #05060e;
            --panel-bg: rgba(13, 15, 30, 0.95);
            --accent-cyan: #00f2fe;
            --accent-blue: #007bff;
            --accent-pink: #ff007f;
            --text-main: #ffffff;
            --text-muted: #4e5d7c;
            --neon-glow: 0 0 25px rgba(0, 242, 254, 0.5);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        body {
            background: radial-gradient(circle at center, #101435 0%, var(--bg-color) 100%);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            overflow: hidden;
        }

        .container {
            width: 100%;
            max-width: 450px;
            height: 85vh;
            background: var(--panel-bg);
            border: 1px solid rgba(0, 242, 254, 0.2);
            border-radius: 32px;
            box-shadow: 0 25px 65px rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(20px);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: relative;
        }

        /* ЭКРАН 1: ВХОД И РЕГИСТРАЦИЯ */
        .screen-view {
            display: flex;
            flex-direction: column;
            width: 100%;
            height: 100%;
        }

        .auth-screen {
            padding: 40px 30px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            gap: 25px;
        }

        .logo-area {
            text-align: center;
        }

        .logo-area h1 {
            font-size: 2.8rem;
            font-weight: 900;
            background: linear-gradient(135deg, #fff 30%, var(--accent-cyan));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: 1px;
            filter: drop-shadow(0 2px 15px rgba(0, 242, 254, 0.4));
        }

        .logo-area p {
            color: var(--text-muted);
            font-size: 0.95rem;
            margin-top: 8px;
        }

        .input-group {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        input {
            width: 100%;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(0, 242, 254, 0.25);
            padding: 16px 20px;
            border-radius: 16px;
            color: #fff;
            font-size: 1rem;
            outline: none;
            transition: all 0.2s ease;
        }

        input:focus {
            border-color: var(--accent-cyan);
            box-shadow: 0 0 15px rgba(0, 242, 254, 0.3);
            background: rgba(255, 255, 255, 0.05);
        }

        .btn {
            width: 100%;
            background: linear-gradient(135deg, var(--accent-blue), var(--accent-cyan));
            color: #000000;
            border: none;
            padding: 16px;
            font-size: 1.1rem;
            font-weight: 800;
            border-radius: 16px;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: all 0.2s ease;
            box-shadow: var(--neon-glow);
        }

        .btn:hover {
            transform: scale(1.02);
            box-shadow: 0 0 30px rgba(0, 242, 254, 0.8);
        }

        .switch-mode {
            color: var(--accent-cyan);
            font-size: 0.9rem;
            cursor: pointer;
            text-decoration: underline;
            user-select: none;
        }

        /* ЭКРАН 2: ВНУТРЕННИЙ САЙТ МЕССЕНДЖЕРА */
        .app-screen {
            display: none;
            flex-direction: column;
            height: 100%;
            width: 100%;
        }

        .app-header {
            padding: 20px 24px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.06);
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(0, 0, 0, 0.3);
        }

        .app-header h2 {
            font-size: 1.4rem;
            font-weight: 800;
            background: linear-gradient(135deg, #fff, var(--accent-cyan));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .logout-btn {
            color: var(--accent-pink);
            font-size: 0.85rem;
            cursor: pointer;
            font-weight: 700;
            text-transform: uppercase;
            text-decoration: underline;
        }

        /* Таббар переключения страниц */
        .tab-bar {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            border-bottom: 1px solid rgba(255, 255, 255, 0.06);
            background: rgba(0, 0, 0, 0.15);
        }

        .tab-btn {
            padding: 15px 0;
            background: none;
            border: none;
            color: var(--text-muted);
            font-size: 0.85rem;
            font-weight: 700;
            cursor: pointer;
            text-align: center;
            transition: all 0.2s ease;
            text-transform: uppercase;
        }

        .tab-btn.active {
            color: var(--accent-cyan);
            border-bottom: 2px solid var(--accent-cyan);
            background: rgba(255, 255, 255, 0.02);
        }

        .tab-content {
            flex: 1;
            display: none;
            flex-direction: column;
            overflow-y: auto;
            padding: 22px;
        }

        .tab-content.active {
            display: flex;
        }

        /* КРАСИВЫЕ ЖИВЫЕ СЧЁТЧИКИ */
        .stats-title {
            font-size: 1.1rem;
            color: var(--accent-cyan);
            margin-bottom: 20px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .stat-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 20px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(0, 242, 254, 0.1);
            border-radius: 16px;
            margin-bottom: 12px;
        }

        .stat-name-lbl {
            font-weight: 600;
            font-size: 1rem;
        }

        .stat-num {
            font-size: 1.3rem;
            font-weight: 800;
            color: #fff;
            text-shadow: 0 0 10px rgba(255,255,255,0.2);
        }

        .stat-num.online-indicator {
            color: #00ff66;
            text-shadow: 0 0 15px #00ff66;
        }

        /* СПИСОК ЧАТОВ */
        .chats-list-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .chat-item {
            display: flex;
            align-items: center;
            padding: 14px 18px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 16px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .chat-item:hover {
            border-color: var(--accent-cyan);
            background: rgba(255, 255, 255, 0.06);
            transform: translateX(3px);
        }

        .chat-avatar {
            width: 42px;
            height: 42px;
            background: linear-gradient(135deg, var(--accent-blue), var(--accent-cyan));
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 900;
            color: #000;
            margin-right: 15px;
        }

        .chat-name {
            font-weight: 700;
            font-size: 1.05rem;
        }

        /* ПЛЕЙСХОЛДЕР ВИДЕО */
        .video-placeholder {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border: 2px dashed rgba(0, 242, 254, 0.2);
            border-radius: 24px;
            padding: 40px 20px;
            text-align: center;
        }

        /* ОКНО ОТКРЫТОГО ДИАЛОГА ЧАТА */
        .active-dialog-view {
            display: none;
            flex-direction: column;
            height: 100%;
            width: 100%;
            background: #05060e;
            position: absolute;
            top: 0; left: 0; z-index: 10;
        }

        .dialog-header {
            padding: 18px 20px;
            border-bottom: 1px solid rgba(255,255,255,0.06);
            display: flex;
            align-items: center;
            background: rgba(255,255,255,0.02);
        }

        .back-btn {
            background: none;
            border: none;
            color: var(--accent-cyan);
            font-size: 1.4rem;
            cursor: pointer;
            margin-right: 15px;
        }

        .messages-area {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .msg-box {
            max-width: 75%;
            padding: 12px 16px;
            border-radius: 18px;
            display: flex;
            flex-direction: column;
            color: #fff;
        }

        .msg-box.incoming { align-self: flex-start; background: rgba(255,255,255,0.06); border-bottom-left-radius: 4px; }
.msg-box.outgoing { align-self: flex-end; background: var(--accent-blue); border-bottom-right-radius: 4px; box-shadow: 0 4px 15px rgba(0, 123, 255, 0.3); }
.msg-text { font-size: 0.98rem; word-break: break-word; }
.input-area {
padding: 16px 20px;
border-top: 1px solid rgba(255,255,255,0.06);
display: flex;
gap: 12px;
background: rgba(0,0,0,0.3);
}
.input-area input { flex: 1; padding: 15px 18px; border-radius: 14px; background: rgba(255,255,255,0.04); border: 1px solid rgba(0, 242, 254, 0.2); color: #fff; outline: none; }
.btn-send { width: auto; padding: 0 22px; background: var(--accent-cyan); color: #000; border-radius: 14px; border: none; font-weight: 800; cursor: pointer; text-transform: uppercase; }

let signUpState = false;
let activeUser = localStorage.getItem('fluent_session') || null;
let activeTargetChat = null;
// ЖИВАЯ И РЕАЛЬНАЯ СТАТИСТИКА
let totalEntries = parseInt(localStorage.getItem('fl_total_entries')) || 412;
let totalReg = parseInt(localStorage.getItem('fl_total_reg')) || 57;
totalEntries += 1;
localStorage.setItem('fl_total_entries', totalEntries);
function renderLiveStats() {
let fakeOnline = Math.floor(Math.random() * 5) + 14; // Живой плавающий онлайн
document.getElementById('stat-online').innerText = fakeOnline;
document.getElementById('stat-entries').innerText = totalEntries.toLocaleString('ru-RU');
document.getElementById('stat-reg').innerText = totalReg.toLocaleString('ru-RU');
}
setInterval(renderLiveStats, 3000);
if (activeUser) { startMessenger(activeUser); }
function toggleMode() {
signUpState = !signUpState;
document.getElementById('main-btn').innerText = signUpState ? "Создать аккаунт" : "Войти / Создать";
document.getElementById('mode-toggle').innerText = signUpState ? "Уже есть профиль? Войти" : "Создать новый аккаунт";
}
function processAuth() {
const login = document.getElementById('user-email').value.trim();
const pass = document.getElementById('user-password').value.trim();
if (!login || !pass) { alert("Заполните все поля!"); return; }
// Логика автоматической регистрации без ошибок
const storedPass = localStorage.getItem(fl_u_${login});
if (!storedPass) {
localStorage.setItem(fl_u_${login}, pass);
totalReg += 1;
localStorage.setItem('fl_total_reg', totalReg);
}
localStorage.setItem('fluent_session', login);
startMessenger(login);
}
function startMessenger(username) {
activeUser = username;
document.getElementById('user-display').innerText = username;
document.getElementById('auth-screen').style.display = 'none';
document.getElementById('app-screen').style.display = 'flex';
if(!localStorage.getItem(fl_friends_${activeUser})) {
localStorage.setItem(fl_friends_${activeUser}, JSON.stringify(["Nazar", "Support_Bot"]));
}
renderLiveStats();
switchTab(1); // Переносим сразу на вкладку ЧАТЫ
renderChatsList();
setInterval(syncMessages, 1000);
}
function exitChat() {
localStorage.removeItem('fluent_session');
location.reload();
}
function switchTab(idx) {
for(let i=0; i<4; i++) {
document.getElementById(tab${i}).classList.remove('active');
document.getElementById(content${i}).classList.remove('active');
}
document.getElementById(tab${idx}).classList.add('active');
document.getElementById(content${idx}).classList.add('active');
if(idx === 1) renderChatsList();
}
function renderChatsList() {
const listContainer = document.getElementById('chats-list');
let friends = JSON.parse(localStorage.getItem(fl_friends_${activeUser})) || [];
if(friends.length === 0) {
listContainer.innerHTML = <div style="text-align:center; color:var(--text-muted); margin-top:20px;">Список пуст. Добавь друзей в меню "Друзья"</div>;
return;
}
let html = "";
friends.forEach(f => {
html += <div class="chat-item" onclick="openDialog('${f}')"> <div class="chat-avatar">${f.charAt(0).toUpperCase()}</div> <div class="chat-info"><div class="chat-name">${f}</div></div> </div>;
});
listContainer.innerHTML = html;
}
function addFriendChat() {
const input = document.getElementById('search-friend-input');
const targetName = input.value.trim();
if(!targetName || targetName === activeUser) return;
let friends = JSON.parse(localStorage.getItem(fl_friends_${activeUser})) || [];
if(!friends.includes(targetName)) {
friends.push(targetName);
localStorage.setItem(fl_friends_${activeUser}, JSON.stringify(friends));
}
openDialog(targetName);
input.value = "";
}
function openDialog(target) {
activeTargetChat = target;
document.getElementById('dialog-title').innerText = target;
document.getElementById('dialog-avatar').innerText = target.charAt(0).toUpperCase();
document.getElementById('active-dialog').style.display = 'flex';
syncMessages();
}
function closeDialog() {
activeTargetChat = null;
document.getElementById('active-dialog').style.display = 'none';
renderChatsList();
}
function postMessage() {
const field = document.getElementById('input-message');
const txt = field.value.trim();
if (!txt || !activeTargetChat) return;
let store = JSON.parse(localStorage.getItem('fluent_packets')) || [];
store.push({ from: activeUser, to: activeTargetChat, text: txt, time: Date.now() });
localStorage.setItem('fluent_packets', JSON.stringify(store));
field.value = '';
syncMessages();
}
function syncMessages() {
if (!activeTargetChat || document.getElementById('active-dialog').style.display !== 'flex') return;
const flow = document.getElementById('msg-flow');
let store = JSON.parse(localStorage.getItem('fluent_packets')) || [];
let dialogMsgs = store.filter(m => (m.from === activeUser && m.to === activeTargetChat) || (m.from === activeTargetChat && m.to === activeUser));
let html = "";
dialogMsgs.forEach(msg => {
const isMine = msg.from === activeUser;
html += <div class="msg-box ${isMine ? 'outgoing' : 'incoming'}"> <div class="msg-text">${msg.text}</div> </div>;
});
if (flow.innerHTML !== html) {
flow.innerHTML = html;
flow.scrollTop = flow.scrollHeight;
}
}
function handleEnter(e) { if (e.key === 'Enter') postMessage(); }
