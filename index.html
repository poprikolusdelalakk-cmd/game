<!DOCTYPE html>
<html lang="ru" translate="no" class="notranslate">
<head>
    <link rel="manifest" href="manifest.json">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="google" content="notranslate">
    <title>Fluent - Авторизация</title>
    <style>
        :root {
            --bg-dark: #0e1621;
            --side-bg: #17212b;
            --accent: #2481cc;
            --accent-hover: #2f93de;
            --text-color: #f5f5f5;
            --text-muted: #7f91a4;
            --border-color: #101921;
            --success: #00ff66;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
        body { background-color: var(--bg-dark); color: var(--text-color); height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px; }
        
        .auth-container { width: 100%; max-width: 380px; display: flex; flex-direction: column; gap: 20px; }
        .auth-box { background-color: var(--side-bg); padding: 40px; border-radius: 20px; border: 1px solid rgba(36, 129, 204, 0.2); box-shadow: 0 15px 50px rgba(0,0,0,0.6); }
        .auth-box h1 { margin-bottom: 8px; font-size: 2.2rem; font-weight: bold; text-align: center; background: linear-gradient(135deg, #fff 40%, var(--accent)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .auth-box p { color: var(--text-muted); font-size: 0.95rem; margin-bottom: 25px; text-align: center; }
        .auth-box input { width: 100%; background-color: var(--bg-dark); border: 1px solid var(--border-color); padding: 14px; border-radius: 12px; color: #fff; margin-bottom: 12px; outline: none; font-size: 1rem; }
        .auth-box input:focus { border-color: var(--accent); }
        .auth-box button { width: 100%; background-color: var(--accent); color: #fff; border: none; padding: 14px; border-radius: 12px; font-size: 1.05rem; font-weight: bold; cursor: pointer; text-transform: uppercase; margin-top: 10px; }
        .auth-box button:hover { background-color: var(--accent-hover); }
        .switch-mode { color: var(--accent); font-size: 0.9rem; cursor: pointer; text-decoration: underline; user-select: none; text-align: center; margin-top: 15px; display: block; }
        
        /* СТИЛЬ СЧЁТЧИКОВ СТАТИСТИКИ */
        .stats-panel { background-color: var(--side-bg); padding: 20px; border-radius: 16px; border: 1px solid rgba(255, 255, 255, 0.05); display: flex; flex-direction: column; gap: 10px; }
        .stat-row { display: flex; justify-content: space-between; align-items: center; font-size: 0.9rem; }
        .stat-label { color: var(--text-muted); }
        .stat-val { font-weight: bold; font-size: 1.1rem; }
    </style>
</head>
<body>

    <div class="auth-container">
        <div class="auth-box">
            <h1 id="auth-title">Вход</h1>
            <p id="auth-subtitle">Fluent Messenger</p>
            <div id="inputs-area"></div>
        </div>

        <!-- КРАСИВАЯ ПАНЕЛЬ СТАТИСТИКИ ПРИ РЕГИСТРАЦИИ/ВХОДЕ -->
        <div class="stats-panel">
            <div class="stat-row">
                <span class="stat-label">В сети сейчас:</span>
                <span class="stat-val" id="stat-online" style="color: var(--success);">0</span>
            </div>
            <div class="stat-row">
                <span class="stat-label">Зарегистрировано:</span>
                <span class="stat-val" id="stat-reg" style="color: var(--accent);">0</span>
            </div>
            <div class="stat-row">
                <span class="stat-label">Всего визитов:</span>
                <span class="stat-val" id="stat-visits">-</span>
            </div>
        </div>
    </div>

    <script>
        let isSignUpMode = false;
        const area = document.getElementById('inputs-area');

        // Инициализация глобальных счётчиков
        let baseVisits = parseInt(localStorage.getItem('fl_global_visits')) || 1240;
        baseVisits += 1;
        localStorage.setItem('fl_global_visits', baseVisits);

        // Считаем реальное количество уникальных аккаунтов в localStorage
        function getRegisteredCount() {
            let count = 2; // Базовые боты по умолчанию (Fluent_Bot и Support_Bot)
            for (let i = 0; i < localStorage.length; i++) {
                if (localStorage.key(i).startsWith('fl_pass_by_name_')) {
                    count++;
                }
            }
            return count;
        }

        function updateLiveStats() {
            let fakeOnline = Math.floor(Math.random() * 4) + 18; // Живой плавающий онлайн
            document.getElementById('stat-online').innerText = fakeOnline;
            document.getElementById('stat-reg').innerText = getRegisteredCount();
            document.getElementById('stat-visits').innerText = localStorage.getItem('fl_global_visits');
        }
        setInterval(updateLiveStats, 2500);

        function renderFields() {
            if (isSignUpMode) {
                document.getElementById('auth-title').innerText = "Регистрация";
                area.innerHTML = `
                    <input type="text" id="reg-phone" placeholder="Номер телефона (+7...)">
                    <input type="text" id="reg-name" placeholder="Твой Никнейм">
                    <input type="password" id="reg-pass" placeholder="Пароль">
                    <button onclick="processRegister()">Создать профиль</button>
                    <span class="switch-mode" onclick="toggleMode(false)">Уже есть аккаунт? Войти</span>
                `;
            } else {
                document.getElementById('auth-title').innerText = "Вход";
                area.innerHTML = `
                    <input type="text" id="login-id" placeholder="Никнейм или Номер">
                    <input type="password" id="login-pass" placeholder="Пароль">
                    <button onclick="processLogin()">Войти в мессенджер</button>
                    <span class="switch-mode" onclick="toggleMode(true)">Еще нет аккаунта? Зарегистрироваться</span>
                `;
            }
            updateLiveStats();
        }

        function toggleMode(mode) {
            isSignUpMode = mode;
            renderFields();
        }

        function processRegister() {
            const phone = document.getElementById('reg-phone').value.trim();
            const name = document.getElementById('reg-name').value.trim();
            const pass = document.getElementById('reg-pass').value.trim();
            if (!phone || !name || !pass) { alert("Заполни все поля!"); return; }

            // Глобальная синхронизация данных пользователя
            localStorage.setItem('fl_pass_by_name_' + name, pass);
            localStorage.setItem('fl_phone_by_name_' + name, phone);
            localStorage.setItem('fl_name_by_phone_' + phone, name);
            
            // Сохраняем имя текущей сессии
            localStorage.setItem('fluent_session', name);
            window.location.href = 'messenger.html';
        }

        function processLogin() {
            const idInput = document.getElementById('login-id').value.trim();
            const pass = document.getElementById('login-pass').value.trim();
            if (!idInput || !pass) { alert("Заполни все поля!"); return; }

            let resolvedName = idInput;
            // Проверка, если юзер входит по номеру телефона
            if (idInput.startsWith('+') || !isNaN(idInput)) {
                resolvedName = localStorage.getItem('fl_name_by_phone_' + idInput) || idInput;
            }

            const storedPass = localStorage.getItem('fl_pass_by_name_' + resolvedName);
            if (storedPass && storedPass !== pass) {
                alert("Неверный пароль!");
                return;
            }

            // Если пароля нет в БД (первый вход) — создаём его на лету
            if (!storedPass) {
                localStorage.setItem('fl_pass_by_name_' + resolvedName, pass);
            }

            localStorage.setItem('fluent_session', resolvedName);
            window.location.href = 'messenger.html';
        }

        if (localStorage.getItem('fluent_session')) {
            window.location.href = 'messenger.html';
        } else {
            renderFields();
        }
    </script>
</body>
</html>
