<!DOCTYPE html>
<html lang="ru" translate="no" class="notranslate">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="google" content="notranslate">
    <title>Fluent Game - Главное Меню</title>
    <style>
        :root {
            --bg-space: #030511;
            --card-bg: rgba(10, 15, 35, 0.7);
            --neon-blue: #00f2fe;
            --neon-purple: #9d4edd;
            --text-main: #ffffff;
            --text-muted: #5c6c8f;
            --success: #00ff66;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
        body, html { 
            background: radial-gradient(circle at center, #0c112b 0%, var(--bg-space) 100%); 
            color: var(--text-main); 
            width: 100%; height: 100%; overflow: hidden; 
            display: flex; align-items: center; justify-content: center;
        }
        .stars {
            position: absolute; width: 100%; height: 100%; top: 0; left: 0; z-index: 1;
            background: radial-gradient(white, rgba(255,255,255,.15) 1px, transparent 30px);
            background-size: 300px 300px; opacity: 0.25;
            animation: spaceScroll 40s linear infinite;
        }
        @keyframes spaceScroll {
            from { background-position: 0 0; }
            to { background-position: 300px 600px; }
        }
        .wrapper { position: relative; z-index: 10; width: 100%; max-width: 410px; padding: 20px; }
        .menu-card {
            background: var(--card-bg); border: 1px solid rgba(0, 242, 254, 0.25); border-radius: 28px;
            padding: 45px 35px; text-align: center; backdrop-filter: blur(25px);
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.7), 0 0 30px rgba(0, 242, 254, 0.15);
        }
        .brand-logo {
            font-size: 2.5rem; font-weight: 900; letter-spacing: 3px; text-transform: uppercase;
            background: linear-gradient(135deg, #ffffff 30%, var(--neon-blue) 70%, var(--neon-purple));
            -webkit-background-clip: text; -webkit-text-fill-color: transparent; 
            margin-bottom: 6px; filter: drop-shadow(0 0 15px rgba(0, 242, 254, 0.4));
        }
        .brand-subtitle { font-size: 0.8rem; color: var(--text-muted); margin-bottom: 40px; text-transform: uppercase; letter-spacing: 2px; font-weight: 700; }
        
        .btn-play {
            display: block; width: 100%; background: linear-gradient(135deg, var(--neon-blue), var(--neon-purple));
            color: #030511; border: none; padding: 20px; border-radius: 16px; 
            font-size: 1.4rem; font-weight: 900; cursor: pointer; 
            text-transform: uppercase; text-decoration: none; letter-spacing: 1px;
            box-shadow: 0 0 25px rgba(0, 242, 254, 0.4); transition: all 0.3s ease; margin-bottom: 35px; text-align: center;
        }
        .btn-play:hover { transform: scale(1.04) translateY(-2px); box-shadow: 0 0 35px var(--neon-blue), 0 0 70px var(--neon-purple); filter: brightness(1.2); }
        
        .stats-panel { background-color: rgba(3, 5, 17, 0.6); padding: 20px; border-radius: 16px; border: 1px solid rgba(0, 242, 254, 0.1); display: flex; flex-direction: column; gap: 10px; text-align: left; }
        .stat-row { display: flex; justify-content: space-between; align-items: center; font-size: 0.95rem; }
        .stat-label { color: rgba(255,255,255,0.4); }
        .stat-val { font-weight: 700; font-size: 1.05rem; }
    </style>
</head>
<body>
    <div class="stars"></div>
    <div class="wrapper">
        <div class="menu-card">
            <div class="brand-logo">Fluent Game</div>
            <div class="brand-subtitle">Кибер-Игровая вселенная</div>

            <!-- ИСПРАВЛЕНО: Теперь кнопка ведет на абсолютно новую вкладку play.html -->
            <a href="play.html" class="btn-play">ЗАПУСТИТЬ КАТКУ</a>

            <div class="stats-panel">
                <div class="stat-row"><span class="stat-label">Сигмы в сети сейчас:</span><span class="stat-val" style="color: var(--success);" id="stat-online">34</span></div>
                <div class="stat-row"><span class="stat-label">База кибер-мозга Джинна:</span><span class="stat-val" style="color: var(--neon-blue);">500+ персонажей</span></div>
                <div class="stat-row"><span class="stat-label">Всего каток сыграно:</span><span class="stat-val" id="total-games" style="color: #fff;">4329</span></div>
            </div>
        </div>
    </div>
    <script translate="no">
        var matches = parseInt(localStorage.getItem('fl_total_matches')) || 4329;
        document.getElementById('total-games').innerText = matches;
        setInterval(function() {
            var fakeOnline = Math.floor(Math.random() * 6) + 34;
            document.getElementById('stat-online').innerText = fakeOnline;
        }, 2000);
    </script>
</body>
</html>
