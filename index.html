<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fluent Messenger - Вход</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
        body { background-color: #0e1621; color: #fff; height: 100vh; display: flex; align-items: center; justify-content: center; }
        .auth-box { background-color: #17212b; padding: 40px; border-radius: 12px; width: 100%; max-width: 360px; text-align: center; box-shadow: 0 12px 40px rgba(0,0,0,0.5); }
        .auth-box h1 { margin-bottom: 20px; font-size: 1.8rem; }
        .auth-box input { width: 100%; background-color: #0e1621; border: 1px solid #101921; padding: 12px; border-radius: 8px; color: #fff; margin-bottom: 15px; outline: none; font-size: 1rem; }
        .auth-box input:focus { border-color: #2481cc; }
        .auth-box button { width: 100%; background-color: #2481cc; color: #fff; border: none; padding: 12px; border-radius: 8px; font-size: 1rem; font-weight: bold; cursor: pointer; text-transform: uppercase; }
        .auth-box button:hover { background-color: #2f93de; }
    </style>
</head>
<body>

    <div class="auth-box">
        <h1>Fluent Messenger</h1>
        <input type="text" id="username-field" placeholder="Введи Никнейм">
        <input type="password" id="password-field" placeholder="Введи Пароль">
        <button onclick="loginAndRedirect()">Войти / Создать аккаунт</button>
    </div>

    <script>
        // Проверяем: если юзер уже логинился ранее, сразу перекидываем его в чат
        if (localStorage.getItem('fluent_session')) {
            window.location.href = 'chat.html';
        }

        function loginAndRedirect() {
            const user = document.getElementById('username-field').value.trim();
            const pass = document.getElementById('password-field').value.trim();
            if (!user || !pass) { alert("Заполни все поля!"); return; }

            // Локально сохраняем профиль
            if (!localStorage.getItem(`fl_pass_${user}`)) {
                localStorage.setItem(`fl_pass_${user}`, pass);
            }

            // Создаем сессию и ЖЕЛЕЗНО перенаправляем браузер на вторую страницу
            localStorage.setItem('fluent_session', user);
            window.location.href = 'chat.html';
        }
    </script>
</body>
</html>
