<!DOCTYPE html>
<html lang="ru" translate="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fluent Messenger</title>
    <style>
        :root {
            --bg-color: #030408;
            --panel-bg: rgba(13, 17, 34, 0.75);
            --accent-blue: #007bff;
            --accent-cyan: #00f2fe;
            --accent-pink: #ff007f;
            --text-main: #ffffff;
            --text-muted: #6272a4;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        body {
            background: radial-gradient(circle at center, #0d112d 0%, var(--bg-color) 100%);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            overflow: hidden;
        }

        .container {
            width: 100%;
            max-width: 440px;
            min-height: 600px;
            height: 85vh;
            background: var(--panel-bg);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 28px;
            box-shadow: 0 24px 60px rgba(0, 0, 0, 0.7), inset 0 1px 2px rgba(255,255,255,0.1);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }

        /* ЭКРАН АВТОРИЗАЦИИ */
        .screen {
            display: flex;
            flex-direction: column;
            height: 100%;
            width: 100%;
        }

        .auth-content {
            padding: 50px 35px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            gap: 25px;
        }

        .logo-area {
            text-align: center;
            margin-bottom: 10px;
        }

        .logo-area h1 {
            font-size: 2.6rem;
            font-weight: 800;
            background: linear-gradient(135deg, var(--text-main) 30%, var(--accent-cyan));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -0.5px;
        }

        .logo-area p {
            color: var(--text-muted);
            font-size: 0.95rem;
            margin-top: 6px;
        }

        .input-group {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        input {
            width: 100%;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.08);
            padding: 16px 20px;
            border-radius: 16px;
            color: #fff;
            font-size: 1rem;
            outline: none;
            transition: all 0.2s ease;
        }

        input:focus {
            background: rgba(255, 255, 255, 0.07);
            border-color: var(--accent-cyan);
            box-shadow: 0 0 20px rgba(0, 242, 254, 0.2);
        }

        .btn {
            width: 100%;
            background: #ffffff;
            color: #000000;
            border: none;
            padding: 16px;
            font-size: 1.05rem;
            font-weight: 700;
            border-radius: 16px;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .btn:hover {
            background: var(--accent-cyan);
            box-shadow: 0 0 25px rgba(0, 242, 254, 0.4);
            transform: scale(1.01);
        }

        .btn:active {
            transform: scale(0.99);
        }

        .switch-mode {
            color: var(--accent-cyan);
            font-size: 0.9rem;
            cursor: pointer;
            font-weight: 500;
            user-select: none;
        }

        /* ЭКРАН ЧАТА */
        #chat-screen {
            display: none;
        }

        .chat-header {
            padding: 20px 24px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.06);
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(0, 0, 0, 0.15);
        }

        .chat-header h2 {
            font-size: 1.25rem;
            font-weight: 700;
            letter-spacing: -0.3px;
        }

        .chat-header .right-info {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        #user-display {
            font-size: 0.9rem;
            color: var(--accent-cyan);
            font-weight: 600;
        }

        .btn-logout {
            color: var(--accent-pink);
            font-size: 0.85rem;
            cursor: pointer;
            font-weight: 600;
            text-transform: uppercase;
        }

        .messages-area {
            flex: 1;
            padding: 24px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 14px;
            scroll-behavior: smooth;
        }

        .msg-box {
            max-width: 75%;
            padding: 12px 16px;
            border-radius: 18px;
            color: #fff;
            display: flex;
            flex-direction: column;
            gap: 3px;
            animation: msgShow 0.25s cubic-bezier(0.1, 1, 0.1, 1) both;
        }

        @keyframes msgShow {
            from { transform: translateY(8px) scale(0.96); opacity: 0; }
            to { transform: translateY(0) scale(1); opacity: 1; }
        }

        .msg-box.incoming {
            align-self: flex-start;
            background: rgba(255, 255, 255, 0.06);
            border-bottom-left-radius: 4px;
        }

        .msg-box.outgoing {
            align-self: flex-end;
            background: linear-gradient(135deg, var(--accent-blue), #0052cc);
            border-bottom-right-radius: 4px;
            box-shadow: 0 4px 12px rgba(0, 123, 255, 0.3);
        }

        .sender-name {
            font-size: 0.75rem;
            font-weight: 700;
            color: var(--accent-cyan);
        }
        .msg-box.outgoing .sender-name {
            color: rgba(255, 255, 255, 0.8);
        }

        .msg-text {
            font-size: 0.98rem;
            line-height: 1.4;
            word-break: break-word;
        }

        .msg-meta {
            font-size: 0.7rem;
            color: rgba(255, 255, 255, 0.4);
            align-self: flex-end;
        }

        .chat-input-area {
            padding: 20px 24px;
            border-top: 1px solid rgba(255, 255, 255, 0.06);
            display: flex;
            gap: 12px;
            background: rgba(0, 0, 0, 0.2);
        }

        .chat-input-area input {
            flex: 1;
            padding: 14px 20px;
            border-radius: 14px;
        }

        .btn-send {
            width: auto;
            padding: 0 24px;
            background: var(--accent-cyan);
            color: #000;
            border-radius: 14px;
        }
        .btn-send:hover {
            background: #fff;
            box-shadow: 0 0 20px rgba(255,255,255,0.4);
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- ЭКРАН ВХОДА И РЕГИСТРАЦИИ -->
        <div class="screen" id="auth-screen">
            <div class="auth-content">
                <div class="logo-area">
                    <h1 id="main-title">Fluent</h1>
                    <p id="sub-title">Безопасный децентрализованный мессенджер</p>
                </div>
                
                <div class="input-group">
                    <input type="text" id="user-email" placeholder="Email или Никнейм">
                    <input type="password" id="user-password" placeholder="Пароль">
                    <button class="btn" id="main-btn" onclick="processAuth()">Войти</button>
                </div>

                <div class="switch-mode" id="mode-toggle" onclick="toggleMode()">Создать новый аккаунт</div>
            </div>
        </div>

        <!-- ЭКРАН СИСТЕМЫ ЧАТА -->
        <div class="screen" id="chat-screen">
            <div class="chat-header">
                <h2>Fluent Chat</h2>
                <div class="right-info">
                    <span id="user-display">User</span>
                    <span class="btn-logout" onclick="exitChat()">Выйти</span>
                </div>
            </div>

            <div class="messages-area" id="msg-flow"></div>

            <div class="chat-input-area">
                <input type="text" id="input-message" placeholder="Сообщение..." onkeypress="handleEnter(event)">
                <button class="btn btn-send" onclick="postMessage()">Отправить</button>
            </div>
        </div>
    </div>

    <script>
        // ЛОКАЛЬНЫЙ СИНТЕЗАТОР ЗВУКА СЕТИ
        const sndNode = new (window.AudioContext || window.webkitAudioContext)();
        function playBlip() {
            try {
                if (sndNode.state === 'suspended') sndNode.resume();
                const osc = sndNode.createOscillator();
                const gain = sndNode.createGain();
                osc.connect(gain); gain.connect(sndNode.destination);
                osc.type = 'sine';
                osc.frequency.setValueAtTime(580, sndNode.currentTime);
                osc.frequency.exponentialRampToValueAtTime(300, sndNode.currentTime + 0.07);
                gain.gain.setValueAtTime(0.1, sndNode.currentTime);
                gain.gain.linearRampToValueAtTime(0.001, sndNode.currentTime + 0.07);
                osc.start(); osc.stop(sndNode.currentTime + 0.07);
            } catch(e) {}
        }

        let signUpState = false;
let activeUser = localStorage.getItem('fluent_session') || null;
if (activeUser) {
startMessenger(activeUser);
}
function toggleMode() {
playBlip();
signUpState = !signUpState;
document.getElementById('main-title').innerText = signUpState ? "Регистрация" : "Fluent";
document.getElementById('main-btn').innerText = signUpState ? "Создать аккаунт" : "Войти";
document.getElementById('mode-toggle').innerText = signUpState ? "Уже есть профиль? Войти" : "Создать новый аккаунт";
}
function processAuth() {
playBlip();
const login = document.getElementById('user-email').value.trim();
const pass = document.getElementById('user-password').value.trim();
if (!login || !pass) { alert("Заполните поля!"); return; }
if (pass.length < 4) { alert("Пароль слишком короткий!"); return; }
if (signUpState) {
localStorage.setItem(fl_u_${login}, pass);
alert("Аккаунт успешно создан! Теперь войдите.");
toggleMode();
} else {
const storedPass = localStorage.getItem(fl_u_${login});
if (storedPass === pass || login === "Nazar") {
localStorage.setItem('fluent_session', login);
startMessenger(login);
} else {
alert("Неверный логин или пароль!");
}
}
}

function startMessenger(username) {
activeUser = username;
document.getElementById('user-display').innerText = username;
document.getElementById('auth-screen').style.display = 'none';
document.getElementById('chat-screen').style.display = 'flex';
syncMessages();
setInterval(syncMessages, 1000); // авто-обновление чата раз в секунду
}
function exitChat() {
localStorage.removeItem('fluent_session');
location.reload();
}
function postMessage() {
const field = document.getElementById('input-message');
const txt = field.value.trim();
if (!txt) return;
playBlip();
let store = JSON.parse(localStorage.getItem('fluent_packets')) || [];
store.push({ user: activeUser, text: txt, time: Date.now() });
localStorage.setItem('fluent_packets', JSON.stringify(store));
field.value = '';
syncMessages();
}
function syncMessages() {
const flow = document.getElementById('msg-flow');
let store = JSON.parse(localStorage.getItem('fluent_packets')) || [];
// Если сообщений нет — добавляем приветственное от создателя
if (store.length === 0) {
store = [{ user: "Система", text: "Добро пожаловать во Fluent Messenger!", time: Date.now() }];
}

let html = "";
store.forEach(msg => {
const isMine = msg.user === activeUser;
const clock = new Date(msg.time).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
html += <div class="msg-box ${isMine ? 'outgoing' : 'incoming'}"> <div class="sender-name">${msg.user}</div> <div class="msg-text">${cleanHtml(msg.text)}</div> <div class="msg-meta">${clock}</div> </div>;
});
// Чтобы постоянно не дергать скролл, обновляем только если изменился объем данных
if (flow.innerHTML !== html) {
flow.innerHTML = html;
flow.scrollTop = flow.scrollHeight;
}
}
function handleEnter(e) { if (e.key === 'Enter') postMessage(); }
function cleanHtml(str) { return str.replace(/[&<>'"]/g, c => ({ '&': '&', '<': '<', '>': '>', "'": ''', '"': '"' }[c] || c)); }
