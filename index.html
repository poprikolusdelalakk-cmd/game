<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fluent Messenger</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
        body { background-color: #0e1621; color: #fff; height: 100vh; display: flex; align-items: center; justify-content: center; }
        .wrapper { width: 100vw; height: 100vh; display: flex; position: relative; }
        
        /* ЭКРАН ВХОДА */
        .auth-screen { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background-color: #0e1621; display: flex; align-items: center; justify-content: center; z-index: 9999; }
        .auth-box { background-color: #17212b; padding: 40px; border-radius: 12px; width: 100%; max-width: 360px; text-align: center; }
        .auth-box h1 { margin-bottom: 20px; font-size: 1.8rem; }
        .auth-box input { width: 100%; background-color: #0e1621; border: 1px solid #101921; padding: 12px; border-radius: 8px; color: #fff; margin-bottom: 15px; outline: none; font-size: 1rem; }
        .auth-box button { width: 100%; background-color: #2481cc; color: #fff; border: none; padding: 12px; border-radius: 8px; font-size: 1rem; font-weight: bold; cursor: pointer; }
        .auth-box button:hover { background-color: #2f93de; }

        /* ГЛАВНЫЙ ИНТЕРФЕЙС */
        .app-screen { display: none; width: 100%; height: 100%; }
        .sidebar { width: 300px; height: 100%; background-color: #17212b; border-right: 1px solid #101921; display: flex; flex-direction: column; }
        .sidebar-header { padding: 15px 20px; border-bottom: 1px solid #101921; display: flex; justify-content: space-between; align-items: center; }
        .sidebar-header h3 { color: #2481cc; }
        .logout-btn { color: #e53935; cursor: pointer; font-size: 0.85rem; font-weight: bold; }
        
        /* Добавление контактов */
        .add-friend-box { padding: 15px 20px; border-bottom: 1px solid #101921; display: flex; gap: 8px; }
        .add-friend-box input { flex: 1; background-color: #0e1621; border: 1px solid #101921; padding: 8px; border-radius: 6px; color: #fff; outline: none; }
        .add-friend-box button { background-color: #2481cc; border: none; color: #fff; padding: 0 12px; border-radius: 6px; cursor: pointer; font-weight: bold; }

        /* Список чатов */
        .chats-list { flex: 1; overflow-y: auto; }
        .chat-item { display: flex; align-items: center; padding: 12px 20px; cursor: pointer; border-bottom: 1px solid rgba(0,0,0,0.1); }
        .chat-item:hover { background-color: rgba(255,255,255,0.02); }
        .chat-item.selected { background-color: #2481cc; }
        .chat-avatar { width: 36px; height: 36px; background-color: #5288c1; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: bold; margin-right: 12px; }
        .chat-item.selected .chat-avatar { background-color: #fff; color: #2481cc; }

        /* Окно диалога справа */
        .main-chat { flex: 1; height: 100%; background-color: #0e1621; display: flex; flex-direction: column; }
        .no-chat { flex: 1; display: flex; align-items: center; justify-content: center; color: #7f91a4; }
        .chat-area { display: none; flex-direction: column; width: 100%; height: 100%; }
        .chat-header { padding: 15px 20px; background-color: #17212b; border-bottom: 1px solid #101921; font-weight: bold; }
        .messages-box { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
        
        .bubble { max-width: 65%; padding: 10px 14px; border-radius: 10px; font-size: 0.95rem; line-height: 1.4; word-break: break-word; }
        .bubble.incoming { align-self: flex-start; background-color: #182533; }
        .bubble.outgoing { align-self: flex-end; background-color: #2b5278; }

        .input-box { padding: 15px 20px; background-color: #17212b; border-top: 1px solid #101921; display: flex; gap: 10px; }
        .input-box input { flex: 1; background-color: #0e1621; border: 1px solid #101921; padding: 12px; border-radius: 8px; color: #fff; outline: none; }
        .input-box button { background-color: #2481cc; border: none; color: #fff; padding: 0 20px; border-radius: 8px; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>

    <div class="wrapper">
        <!-- ЭКРАН ВХОДА -->
        <div class="auth-screen" id="auth-screen">
            <div class="auth-box">
                <h1>Fluent Messenger</h1>
                <input type="text" id="username-field" placeholder="Введи Никнейм">
                <input type="password" id="password-field" placeholder="Введи Пароль">
                <button onclick="login()">Войти / Создать аккаунт</button>
            </div>
        </div>

        <!-- ГЛАВНЫЙ ЭКРАН -->
        <div class="app-screen" id="app-screen">
            <!-- Слева список чатов -->
            <div class="sidebar">
                <div class="sidebar-header">
                    <h3 id="my-name-display">Ник</h3>
                    <span class="logout-btn" onclick="logout()">Выйти</span>
                </div>
                <div class="add-friend-box">
                    <input type="text" id="friend-name-input" placeholder="Ник друга...">
                    <button onclick="addContact()">+</button>
                </div>
                <div class="chats-list" id="chats-list"></div>
            </div>

            <!-- Справа окно переписки -->
            <div class="main-chat">
                <div class="no-chat" id="no-chat-placeholder">
                    <span>Выбери контакт слева, чтобы начать чат</span>
                </div>
                <div class="chat-area" id="chat-area">
                    <div class="chat-header" id="chat-title">Чат</div>
                    <div class="messages-box" id="messages-box"></div>
                    <div class="input-box">
                        <input type="text" id="message-input" placeholder="Напиши сообщение..." onkeypress="handleEnter(event)">
                        <button onclick="sendMsg()">Тык</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        let myName = localStorage.getItem('fluent_session') || null;
        let currentChatUser = null;

        if (myName) { initApp(myName); }

        function login() {
            const user = document.getElementById('username-field').value.trim();
            const pass = document.getElementById('password-field').value.trim();
            if (!user || !pass) { alert("Заполни все поля!"); return; }

            // Если аккаунт новый — сохраняем пароль
            if (!localStorage.getItem(`fl_pass_${user}`)) {
                localStorage.setItem(`fl_pass_${user}`, pass);
            }

            localStorage.setItem('fluent_session', user);
            initApp(user);
        }

        function initApp(username) {
            myName = username;
            document.getElementById('my-name-display').innerText = username;
            document.getElementById('auth-screen').style.display = 'none';
            document.getElementById('app-screen').style.display = 'flex';

            // Базовые контакты, если список пуст
            if (!localStorage.getItem(`fl_contacts_${myName}`)) {
                localStorage.setItem(`fl_contacts_${myName}`, JSON.stringify(["Nazar", "Support_Bot"]));
            }

            updateContactsList();
            setInterval(updateMessagesBox, 1000); // Обновление сообщений каждую секунду
        }

        function logout() {
            localStorage.removeItem('fluent_session');
            location.reload();
        }

        function updateContactsList() {
            const list = document.getElementById('chats-list');
            let contacts = JSON.parse(localStorage.getItem(`fl_contacts_${myName}`)) || [];
            let html = "";

            contacts.forEach(c => {
                let isSelected = c === currentChatUser;
                html += `
                    <div class="chat-item ${isSelected ? 'selected' : ''}" onclick="openChat('${c}')">
                        <div class="chat-avatar">${c.charAt(0).toUpperCase()}</div>
                        <div class="chat-name">${c}</div>
                    </div>
                `;
            });
            list.innerHTML = html;
        }

        function addContact() {
            const input = document.getElementById('friend-name-input');
            const target = input.value.trim();
            if (!target || target === myName) return;

            let contacts = JSON.parse(localStorage.getItem(`fl_contacts_${myName}`)) || [];
            if (!contacts.includes(target)) {
                contacts.push(target);
                localStorage.setItem(`fl_contacts_${myName}`, JSON.stringify(contacts));
            }
            openChat(target);
            input.value = "";
        }

        function openChat(username) {
            currentChatUser = username;
            document.getElementById('no-chat-placeholder').style.display = 'none';
            document.getElementById('chat-area').style.display = 'flex';
            document.getElementById('chat-title').innerText = username;
            updateContactsList();
            updateMessagesBox();
        }

        function sendMsg() {
            const input = document.getElementById('message-input');
            const text = input.value.trim();
            if (!text || !currentChatUser) return;

            let allMsgs = JSON.parse(localStorage.getItem('fluent_msg_storage')) || [];
            allMsgs.push({ from: myName, to: currentChatUser, txt: text });
            localStorage.setItem('fluent_msg_storage', JSON.stringify(allMsgs));
            
            input.value = "";
            updateMessagesBox();
        }

        function updateMessagesBox() {
if (!currentChatUser || document.getElementById('chat-area').style.display !== 'flex') return;
const box = document.getElementById('messages-box');
let allMsgs = JSON.parse(localStorage.getItem('fluent_msg_storage')) || [];
// Фильтруем сообщения только для текущего диалога
let activeMsgs = allMsgs.filter(m => (m.from === myName && m.to === currentChatUser) || (m.from === currentChatUser && m.to === myName));
let html = "";
activeMsgs.forEach(m => {
let isMine = m.from === myName;
html += <div class="bubble ${isMine ? 'outgoing' : 'incoming'}"> <div class="msg-text">${escapeHTML(m.txt)}</div> </div>;
});
if (box.innerHTML !== html) {
box.innerHTML = html;
box.scrollTop = box.scrollHeight;
}
}
function handleEnter(e) { if (e.key === 'Enter') sendMsg(); }
function escapeHTML(str) { return str.replace(/[&<>'"]/g, c => ({ '&': '&', '<': '<', '>': '>', "'": ''', '"': '"' }[c] || c)); }
