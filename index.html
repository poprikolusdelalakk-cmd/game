<!DOCTYPE html>
<html lang="ru" translate="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nazar Message | Кибер-Мессенджер</title>
    <script src="https://jsdelivr.net"></script>
    <script src="https://jsdelivr.net"></script>
    <style>
        :root {
            --bg-color: #04050a;
            --card-bg: rgba(10, 12, 26, 0.9);
            --accent-cyan: #00f2fe;
            --accent-purple: #9d4edd;
            --accent-pink: #ff007f;
            --neon-cyan: 0 0 20px rgba(0, 242, 254, 0.6);
            --text-main: #ffffff;
            --text-muted: #64748b;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Roboto, sans-serif; }
        body {
            background: radial-gradient(circle at center, #0f1123 0%, var(--bg-color) 100%);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .container {
            width: 100%;
            max-width: 850px;
            height: 85vh;
            background: var(--card-bg);
            border: 2px solid var(--accent-purple);
            border-radius: 24px;
            box-shadow: 0 0 30px rgba(157, 78, 221, 0.3);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        .auth-screen {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            gap: 20px;
            padding: 40px;
        }
        .auth-screen h1 {
            font-size: 3rem;
            font-weight: 900;
            background: linear-gradient(135deg, var(--accent-pink), var(--accent-cyan));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-transform: uppercase;
            letter-spacing: 3px;
        }
        .auth-box { width: 100%; max-width: 380px; display: flex; flex-direction: column; gap: 15px; }
        input {
            width: 100%;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(0, 242, 254, 0.3);
            padding: 14px 20px;
            border-radius: 12px;
            color: #fff;
            font-size: 1rem;
            outline: none;
        }
        input:focus { border-color: var(--accent-cyan); box-shadow: var(--neon-cyan); }
        .btn {
            background: linear-gradient(135deg, var(--accent-purple), var(--accent-cyan));
            color: #000;
            border: none;
            padding: 14px;
            font-size: 1.1rem;
            font-weight: 800;
            border-radius: 12px;
            cursor: pointer;
            text-transform: uppercase;
        }
        .chat-screen { display: none; flex-direction: column; height: 100%; }
        .chat-header {
            padding: 20px;
            border-bottom: 1px solid rgba(157, 78, 221, 0.3);
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(4, 5, 10, 0.5);
        }
        .chat-header h2 { color: var(--accent-cyan); text-shadow: var(--neon-cyan); }
        .logout-link { color: var(--accent-pink); cursor: pointer; font-weight: 700; }
        .messages-area {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 15px;
            background: rgba(5, 6, 15, 0.3);
        }
        .msg-container { max-width: 70%; display: flex; flex-direction: column; gap: 4px; padding: 12px 18px; border-radius: 16px; color: #fff; }
        .msg-container.incoming { align-self: flex-start; background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.1); }
        .msg-container.outgoing { align-self: flex-end; background: linear-gradient(135deg, rgba(157, 78, 221, 0.3), rgba(0, 242, 254, 0.2)); border: 1px solid var(--accent-cyan); }
        .msg-user { font-size: 0.8rem; font-weight: 700; color: var(--accent-cyan); }
        .msg-text { font-size: 1rem; line-height: 1.4; word-break: break-word; }
        .msg-time { font-size: 0.7rem; color: var(--text-muted); align-self: flex-end; }
        .input-area { padding: 20px; border-top: 1px solid rgba(157, 78, 221, 0.3); display: flex; gap: 15px; background: rgba(4, 5, 10, 0.7); }
        .input-area input { flex: 1; }
    </style>
</head>
<body>
    <div class="container">
        <div class="auth-screen" id="auth-screen">
            <h1>Nazar Message</h1>
            <div class="auth-box">
                <input type="text" id="auth-username" placeholder="Придумай Никнейм">
                <input type="password" id="auth-password" placeholder="Придумай пароль">
                <button class="btn" onclick="handleAuth()">Войти / Создать профиль</button>
            </div>
        </div>
        <div class="chat-screen" id="chat-screen">
            <div class="chat-header">
                <h2>Nazar Message // Чат</h2>
                <div class="logout-link" onclick="logout()">Выйти</div>
            </div>
            <div class="messages-area" id="messages-area"></div>
            <div class="input-area">
                <input type="text" id="msg-input" placeholder="Напиши сообщение..." onkeypress="checkEnter(event)">
                <button class="btn" onclick="sendMessage()">Отправить</button>
            </div>
        </div>
    </div>
    <script>
        const gun = Gun(['https://herokuapp.com', 'https://peer.ooo']);
        const user = gun.user().recall({localStorage: true});
        let myUsername = "";

        if (user.is) {
            user.get('profile').get('alias').once(name => { myUsername = name; showChatScreen(); });
        }

        function handleAuth() {
            const name = document.getElementById('auth-username').value.trim();
            const pass = document.getElementById('auth-password').value.trim();
            if (!name || !pass) { alert("Заполни все поля!"); return; }
            user.auth(name, pass, ack => {
                if (ack.err) {
                    user.create(name, pass, createAck => {
                        if (createAck.err) { alert("Ошибка: " + createAck.err); } 
                        else { user.auth(name, pass, () => { myUsername = name; user.get('profile').put({alias: name}); showChatScreen(); }); }
                    });
                } else { myUsername = name; showChatScreen(); }
            });
        }

        function showChatScreen() {
            document.getElementById('auth-screen').style.display = 'none';
            document.getElementById('chat-screen').style.display = 'flex';
            loadMessages();
        }

        function logout() { user.leave(); location.reload(); }

        function sendMessage() {
            const input = document.getElementById('msg-input');
            const text = input.value.trim();
            if (!text) return;
            gun.get('nazarchat').set({ text: text, user: myUsername, time: Date.now() });
            input.value = '';
        }

        function loadMessages() {
            const area = document.getElementById('messages-area');
            const renderedIds = new Set();
            gun.get('nazarchat').map().once((msg, id) => {
                if (!msg || !msg.text || renderedIds.has(id)) return;
                renderedIds.add(id);
                const isMyMessage = msg.user === myUsername;
                const msgDiv = document.createElement('div');
                msgDiv.className = `msg-container ${isMyMessage ? 'outgoing' : 'incoming'}`;
                const formattedTime = new Date(msg.time).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
                msgDiv.innerHTML = `<div class="msg-user">${msg.user}</div><div class="msg-text">${escapeHTML(msg.text)}</div><div class="msg-time">${formattedTime}</div>`;
                area.appendChild(msgDiv);
                area.scrollTop = area.scrollHeight;
            });
        }

        function checkEnter(e) { if (e.key === 'Enter') sendMessage(); }
        function escapeHTML(str) { return str.replace(/[&<>'"]/g, tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag)); }
    </script>
</body>
</html>
