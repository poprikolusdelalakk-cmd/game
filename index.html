<!DOCTYPE html>
<html lang="ru" translate="no" class="notranslate">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="google" content="notranslate">
    <title>Fluent Game - Главное Меню</title>
    <style>
        :root {
            --bg-space: #060919;
            --card-bg: rgba(13, 18, 38, 0.75);
            --neon-blue: #00f2fe;
            --neon-purple: #9d4edd;
            --text-main: #ffffff;
            --text-muted: #6f7f9f;
            --success: #00ff66;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
        body, html { 
            background: radial-gradient(circle at center, #12183a 0%, var(--bg-space) 100%); 
            color: var(--text-main); 
            width: 100%; height: 100%; overflow: hidden; 
            display: flex; align-items: center; justify-content: center;
        }
        .space-bg {
            position: absolute; width: 100%; height: 100%; top: 0; left: 0; z-index: 1;
            background-image: radial-gradient(white, rgba(255,255,255,.2) 2px, transparent 40px);
            background-size: 550px 550px; opacity: 0.2;
        }
        .wrapper { position: relative; z-index: 10; width: 100%; max-width: 400px; padding: 20px; }
        .menu-card {
            background: var(--card-bg); border: 1px solid rgba(0, 242, 254, 0.2); border-radius: 24px;
            padding: 40px 30px; text-align: center; backdrop-filter: blur(15px);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
        }
        .brand-title {
            font-size: 2.2rem; font-weight: 900; letter-spacing: 2px; text-transform: uppercase;
            background: linear-gradient(135deg, #fff, var(--neon-blue));
            -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin-bottom: 5px;
        }
        .brand-subtitle { font-size: 0.85rem; color: var(--text-muted); margin-bottom: 35px; letter-spacing: 1px; }
        
        /* КНОПКА ИГРАТЬ ДЛЯ ПЕРЕХОДА НА ВКЛАДКУ GAME.HTML */
        .btn-play {
            display: block; width: 100%; background: linear-gradient(135deg, var(--neon-blue), var(--neon-purple));
            color: #000; border: none; padding: 18px; border-radius: 14px; font-size: 1.3rem;
            font-weight: 900; cursor: pointer; text-transform: uppercase; text-decoration: none;
            box-shadow: 0 0 20px rgba(0, 242, 254, 0.4); transition: all 0.3s ease; margin-bottom: 30px;
            text-align: center;
        }
        .btn-play:hover { transform: scale(1.03); box-shadow: 0 0 30px var(--neon-blue); filter: brightness(1.2); }
        
        .stats-panel { background-color: rgba(0,0,0,0.4); padding: 18px; border-radius: 14px; border: 1px solid rgba(255, 255, 255, 0.05); display: flex; flex-direction: column; gap: 8px; text-align: left; }
        .stat-row { display: flex; justify-content: space-between; align-items: center; font-size: 0.9rem; }
        .stat-label { color: var(--text-muted); }
        .stat-val { font-weight: bold; }
    </style>
</head>
<body>
    <div class="space-bg"></div>
    <div class="wrapper">
        <div class="menu-card">
            <div class="brand-title">Fluent Game</div>
            <div class="brand-subtitle">Игровая Платформа</div>

            <!-- Прямой и чёткий переход на игровую страницу -->
            <a href="game.html" class="btn-play">ИГРАТЬ</a>

            <div class="stats-panel">
                <div class="stat-row"><span class="stat-label">Игроков в сети:</span><span class="stat-val" style="color: var(--success);" id="stat-online">24</span></div>
                <div class="stat-row"><span class="stat-label">Персонажей в БД:</span><span class="stat-val" style="color: var(--neon-blue);">350+</span></div>
                <div class="stat-row"><span class="stat-label">Всего визитов:</span><span class="stat-val" id="total-visits">1269</span></div>
            </div>
        </div>
    </div>
    <script translate="no">
        // Живые счётчики без багов авторизации
        var visits = parseInt(localStorage.getItem('fl_global_visits_game')) || 1269;
        visits += 1;
        localStorage.setItem('fl_global_visits_game', visits);
        document.getElementById('total-visits').innerText = visits;

        setInterval(function() {
            var fakeOnline = Math.floor(Math.random() * 5) + 21;
            document.getElementById('stat-online').innerText = fakeOnline;
        }, 3000);
    </script>
</body>
</html>
