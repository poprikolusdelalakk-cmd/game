<!DOCTYPE html>
<html lang="ru" translate="no" class="notranslate">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fluent Arena - Ожидание ответа</title>
    <style>
        :root { --bg: #02040a; --blue: #00f2fe; --purple: #9d4edd; --pink: #ff007f; --success: #00ff66; --danger: #ff3333; }
        body { background: radial-gradient(circle at center, #0c112b 0%, var(--bg) 100%); color: #fff; font-family: sans-serif; height: 100vh; display: flex; align-items: center; justify-content: center; }
        .box { background: rgba(14,22,47,0.85); border: 1px solid var(--blue); border-radius: 24px; padding: 40px 30px; text-align: center; max-width: 400px; width: 100%; box-shadow: 0 0 30px rgba(0,242,254,0.2); }
        .spinner { width: 70px; height: 70px; border: 4px solid rgba(255,255,255,0.05); border-top: 4px solid var(--blue); border-radius: 50%; margin: 0 auto 25px auto; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        h3 { color: var(--blue); margin-bottom: 10px; font-size: 1.3rem; text-transform: uppercase; letter-spacing: 1px; }
        p { color: #8fa0b5; font-size: 0.95rem; margin-bottom: 25px; }
        .btn-cancel { display: block; background: var(--danger); color: #fff; padding: 12px; border-radius: 10px; font-weight: bold; text-decoration: none; text-transform: uppercase; font-size: 0.9rem; }
    </style>
</head>
<body>
    <div class="box">
        <div class="spinner"></div>
        <h3>Ожидание ответа от игрока</h3>
        <p id="target-info">Передача инвайта в сеть...</p>
        <div id="response-status" style="font-weight:bold; margin-bottom:15px; text-transform:uppercase;"></div>
        <a href="friends.html" class="btn-cancel" onclick="cancelCall()">Отменить вызов</a>
    </div>

    <!-- Подключаем облачный синхронизатор PeerJS, чтобы связать ПК и телефон напрямую -->
    <script src="https://unpkg.com"></script>
    <script>
        var myId = localStorage.getItem('fl_user_id') || "111111";
        var enemyNick = localStorage.getItem('enemy_player_name') || "Сигма-Бро";
        var enemyId = localStorage.getItem('enemy_player_id') || "000000";

        document.getElementById('target-info').innerText = "Вызов отправлен на аккаунт " + enemyNick + " [ID: #" + enemyId + "]";

        // Подключаемся к глобальному серверу под уникальным именем
        var peer = new Peer('fluent-arena-call-' + myId);

        peer.on('open', function() {
            // Как только открыли канал — каждую секунду проверяем статус ответа
            checkResponseLoop();
        });

        function checkResponseLoop() {
            var loop = setInterval(function() {
                // Симуляция получения сетевого ответа (для теста с двух устройств)
                // На втором устройстве запишется статус 'accepted_' + myId в глобальный лог
                var status = localStorage.getItem('fl_invite_status_from_' + enemyId);
                
                if (status === 'accepted') {
                    clearInterval(loop);
                    document.getElementById('response-status').innerText = "✅ ВЫЗОВ ПРИНЯТ! ВХОД НА АРЕНУ...";
                    document.getElementById('response-status').style.color = "var(--success)";
                    localStorage.setItem('fl_is_active_pvp', 'true');
                    setTimeout(function() { window.location.href = 'arena.html'; }, 1200);
                } else if (status === 'rejected') {
                    clearInterval(loop);
                    document.getElementById('response-status').innerText = "❌ ВЫЗОВ ОТКЛОНЕН СОПЕРНИКОМ!";
                    document.getElementById('response-status').style.color = "var(--danger)";
                }
            }, 1000);
        }

        function cancelCall() {
            localStorage.setItem('fl_invite_status_from_' + myId, 'cancelled');
        }
    </script>
</body>
</html>
