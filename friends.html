<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FLUENT ARENA - СОЦИАЛЬНЫЙ ЦЕНТР</title>
    <script src="https://unpkg.com"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
        body {
            background-color: #060b13; color: white;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex; justify-content: center; align-items: center; min-height: 100vh;
            padding: 10px;
        }
        .social-card {
            background: #0d1625; border: 2px solid #1e293b; border-radius: 24px;
            padding: 25px; width: 100%; max-width: 460px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.7);
        }
        h2 { font-size: 22px; text-align: center; margin-bottom: 15px; text-transform: uppercase; color: #38bdf8; }
        
        /* Мой ID профиль */
        .profile-badge {
            background: rgba(56, 189, 248, 0.08); padding: 12px; border-radius: 14px;
            margin-bottom: 20px; border: 1px dashed #38bdf8; text-align: center; font-size: 15px;
        }
        .profile-badge b { color: #38bdf8; font-size: 18px; letter-spacing: 1px; }

        /* Вкладки (Навигация) */
        .tabs { display: flex; gap: 8px; margin-bottom: 20px; border-bottom: 1px solid #1e293b; padding-bottom: 10px; }
        .tab-btn {
            flex: 1; padding: 10px 5px; background: transparent; border: none; color: #64748b;
            font-size: 13px; font-weight: 700; cursor: pointer; border-radius: 8px; transition: 0.2s;
            position: relative;
        }
        .tab-btn.active { color: #ffffff; background: #1e293b; }
        .badge {
            position: absolute; top: -5px; right: 2px; background: #f43f5e; color: white;
            font-size: 10px; padding: 2px 6px; border-radius: 10px; display: none;
        }

        /* Контент вкладок */
        .tab-content { display: none; min-height: 180px; max-height: 250px; overflow-y: auto; margin-bottom: 20px; }
        .tab-content.active { display: block; }

        /* Поля ввода и кнопки */
        input {
            width: 100%; padding: 14px; background: #111827; border: 2px solid #1e293b;
            border-radius: 12px; color: white; font-size: 15px; text-align: center; margin-bottom: 15px; outline: none;
        }
        input:focus { border-color: #a855f7; }
        .btn {
            width: 100%; padding: 14px; border: none; border-radius: 12px; font-size: 15px;
            font-weight: 700; cursor: pointer; color: white; margin-bottom: 10px; transition: transform 0.1s;
        }
        .btn:active { transform: scale(0.98); }
        .btn-primary { background: linear-gradient(135deg, #a855f7 0%, #ec4899 100%); }
        .btn-bot { background: linear-gradient(135deg, #06b6d4 0%, #3b82f6 100%); }
        .btn-secondary { background: #1e293b; }

        /* Элементы списков */
        .list-item {
            display: flex; justify-content: space-between; align-items: center;
            background: #111827; padding: 12px 16px; border-radius: 12px;
            margin-bottom: 8px; border: 1px solid #1e293b;
        }
        .item-info { display: flex; flex-direction: column; gap: 2px; }
        .item-name { font-weight: 700; font-size: 14px; }
        .item-status { font-size: 11px; color: #64748b; }
        .item-status.online { color: #34d399; }
        .action-btns { display: flex; gap: 6px; }
        .action-btn {
            padding: 6px 12px; border: none; border-radius: 6px; font-size: 12px;
            font-weight: 700; cursor: pointer; color: white;
        }
        .btn-accept { background: #10b981; }
        .btn-decline { background: #f43f5e; }
        .btn-fight { background: #f59e0b; }
        
        .empty-text { text-align: center; color: #475569; font-size: 14px; padding-top: 40px; }
    </style>
</head>
<body>

    <div class="social-card">
        <h2>Fluent Сообщество</h2>
        
        <!-- Личный Сигма-ID -->
        <div class="profile-badge">
            Твой Ник: <span id="my-name-display" style="color:#fff; font-weight:700;">...</span> | Сигма-ID: <b id="my-id-display">------</b>
        </div>

        <!-- Навигация по вкладкам -->
        <div class="tabs">
            <button class="tab-btn active" onclick="switchTab('friends-tab', this)">Друзья</button>
            <button class="tab-btn" onclick="switchTab('requests-tab', this)">Запросы <span class="badge" id="req-count">0</span></button>
            <button class="tab-btn" onclick="switchTab('invites-tab', this)">Вызовы <span class="badge" id="inv-count">0</span></button>
        </div>

        <!-- ВКЛАДКА 1: ДРУЗЬЯ -->
        <div id="friends-tab" class="tab-content active">
            <div id="friends-list"></div>
        </div>

        <!-- ВКЛАДКА 2: ЗАПРОСЫ В ДРУЗЬЯ -->
        <div id="requests-tab" class="tab-content">
            <div id="requests-list"></div>
        </div>

        <!-- ВКЛАДКА 3: ВХОДЯЩИЕ ВЫЗОВЫ НА ДУЭЛЬ -->
        <div id="invites-tab" class="tab-content">
            <div id="invites-list"></div>
        </div>

        <!-- Форма отправки чего-либо -->
        <input type="text" id="global-input" placeholder="Введите Сигма-ID...">
        
        <button class="btn btn-primary" onclick="handleMainAction()">ОТПРАВИТЬ ЗАПРОС В ДРУЗЬЯ</button>
        <button class="btn btn-bot" onclick="window.location.href='arena.html?mode=bot'">БЫСТРЫЙ БОЙ С БОТОМ</button>
        <button class="btn btn-secondary" onclick="window.location.href='index.html'">В ГЛАВНОЕ МЕНЮ</button>
    </div>

    <script>
        // Инициализация данных игрока
        const myName = localStorage.getItem('nickname') || 'Flerenk';
        document.getElementById('my-name-display').textContent = myName;

        let myId = localStorage.getItem('sigma_id');
        if(!myId) {
            myId = Math.floor(100000 + Math.random() * 900000).toString();
            localStorage.setItem('sigma_id', myId);
        }
        document.getElementById('my-id-display').textContent = myId;

        // Локальное хранилище друзей и запросов
        let friends = JSON.parse(localStorage.getItem('fluent_friends')) || [];
        let friendRequests = [];
        let duelInvites = [];

        // Переключение вкладок
        let activeTabId = 'friends-tab';
        function switchTab(tabId, btnElement) {
            activeTabId = tabId;
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
            
            document.getElementById(tabId).classList.add('active');
            btnElement.classList.add('active');

            const input = document.getElementById('global-input');
            if(tabId === 'friends-tab') {
                input.placeholder = "Введите Сигма-ID друга для вызова...";
                document.querySelector('.btn-primary').textContent = "ВЫЗВАТЬ ДРУГА НА ДУЭЛЬ";
            } else {
                input.placeholder = "Введите Сигма-ID для добавления...";
                document.querySelector('.btn-primary').textContent = "ОТПРАВИТЬ ЗАПРОС В ДРУЗЬЯ";
            }
        }

        // Подключение к Сети (MQTT)
        const client = mqtt.connect('wss://test.mosquitto.org:8081');
        
        client.on('connect', () => {
            // Подписываемся на свой личный ID для получения сообщений
            client.subscribe(`fluentarena/user/${myId}`);
        });

        client.on('message', (topic, message) => {
            try {
                let packet = JSON.parse(message.toString());
                
                // 1. Получен запрос в друзья
                if(packet.type === 'friend_request') {
                    if(!friendRequests.some(r => r.id === packet.fromId)) {
                        friendRequests.push({ id: packet.fromId, name: packet.fromName });
                        renderAll();
                    }
                }
                // 2. Запрос в друзья принят
                if(packet.type === 'friend_accept') {
                    if(!friends.some(f => f.id === packet.fromId)) {
                        friends.push({ id: packet.fromId, name: packet.fromName });
                        localStorage.setItem('fluent_friends', JSON.stringify(friends));
                        renderAll();
                    }
                }
                // 3. Получен вызов на дуэль
                if(packet.type === 'duel_invite') {
                    if(!duelInvites.some(i => i.room === packet.room)) {
                        duelInvites.push({ id: packet.fromId, name: packet.fromName, room: packet.room });
                        renderAll();
                    }
                }
            } catch(e){}
        });

        // Основное действие по кнопке
        function handleMainAction() {
            let targetId = document.getElementById('global-input').value.trim();
            if(!targetId || targetId === myId) {
                alert('Введите корректный ID другого игрока!');
                return;
            }

            if(activeTabId === 'friends-tab') {
                // Если мы на вкладке друзей — кидаем инвайт в бой выбранному другу
                let targetFriend = friends.find(f => f.id === targetId);
                let roomName = `room_${myId}_${targetId}`;
                
                client.publish(`fluentarena/user/${targetId}`, JSON.stringify({
                    type: 'duel_invite', fromId: myId, fromName: myName, room: roomName
                }));
                
                alert(`Вызов отправлен! Переходим в комнату ожидания...`);
                window.location.href = `arena.html?mode=online&role=host&room=${roomName}`;
            } else {
// Иначе отправляем запрос в друзья
client.publish(fluentarena/user/${targetId}, JSON.stringify({
type: 'friend_request', fromId: myId, fromName: myName
}));
alert(Запрос в друзья для ID ${targetId} успешно отправлен в сеть!);
document.getElementById('global-input').value = '';
}
}
// Принять запрос в друзья
function acceptFriend(id, name) {
friendRequests = friendRequests.filter(r => r.id !== id);
if(!friends.some(f => f.id === id)) {
friends.push({ id: id, name: name });
localStorage.setItem('fluent_friends', JSON.stringify(friends));
}
// Отправляем ответку, чтобы у него мы тоже добавились
client.publish(fluentarena/user/${id}, JSON.stringify({
type: 'friend_accept', fromId: myId, fromName: myName
}));
renderAll();
}
// Отклонить запрос
function declineFriend(id) {
friendRequests = friendRequests.filter(r => r.id !== id);
renderAll();
}
// Принять вызов на дуэль и войти в игру
function acceptDuel(room) {
window.location.href = arena.html?mode=online&role=guest&room=${room};
}
// Отрендерить списки на экране
function renderAll() {
// 1. Рендер друзей
const fList = document.getElementById('friends-list');
if(friends.length === 0) {
fList.innerHTML = <div class="empty-text">Список друзей пуст.<br>Добавьте кого-нибудь по ID!</div>;
} else {
fList.innerHTML = friends.map(f => <div class="list-item"> <div class="item-info"> <span class="item-name">👤 ${f.name}</span> <span class="item-status online">ID: ${f.id}</span> </div> <div class="action-btns"> <button class="action-btn btn-fight" onclick="document.getElementById('global-input').value='${f.id}'; handleMainAction();">В БОЙ</button> </div> </div>).join('');
}
// 2. Рендер запросов
const rList = document.getElementById('requests-list');
document.getElementById('req-count').textContent = friendRequests.length;
document.getElementById('req-count').style.display = friendRequests.length > 0 ? 'inline' : 'none';
if(friendRequests.length === 0) {
rList.innerHTML = <div class="empty-text">Нет новых запросов в друзья</div>;
} else {
rList.innerHTML = friendRequests.map(r => <div class="list-item"> <div class="item-info"> <span class="item-name">📩 ${r.name}</span> <span class="item-status">Хочет в друзья (ID: ${r.id})</span> </div> <div class="action-btns"> <button class="action-btn btn-accept" onclick="acceptFriend('${r.id}', '${r.name}')">✓</button> <button class="action-btn btn-decline" onclick="declineFriend('${r.id}')">✕</button> </div> </div>).join('');
}
// 3. Рендер вызовов на дуэль
const iList = document.getElementById('invites-list');
document.getElementById('inv-count').textContent = duelInvites.length;
document.getElementById('inv-count').style.display = duelInvites.length > 0 ? 'inline' : 'none';
if(duelInvites.length === 0) {
iList.innerHTML = <div class="empty-text">Вас пока никто не вызывал</div>;
} else {
iList.innerHTML = duelInvites.map(i => <div class="list-item"> <div class="item-info"> <span class="item-name">⚔️ БОЙ ОТ: ${i.name}</span> <span class="item-status" style="color:#f59e0b;">Вызывает вас на дуэль!</span> </div> <div class="action-btns"> <button class="action-btn btn-fight" onclick="acceptDuel('${i.room}')">ПРИНЯТЬ</button> </div> </div>).join('');
}
}
// Первичный рендер при загрузке страницы
renderAll();
