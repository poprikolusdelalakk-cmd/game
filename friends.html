<!DOCTYPE html>
<html lang="ru" translate="no" class="notranslate">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fluent Arena - Друзья и Дуэли</title>
    <style>
        :root { --bg: #02040a; --card: rgba(14, 22, 47, 0.85); --blue: #00f2fe; --purple: #9d4edd; --success: #00ff66; --pink: #ff007f; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
        body { background: radial-gradient(circle at center, #0c112b 0%, var(--bg) 100%); color: #fff; display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 20px; }
        .box { background: var(--card); border: 1px solid rgba(0,242,254,0.2); border-radius: 24px; padding: 30px; max-width: 400px; width: 100%; text-align: center; box-shadow: 0 20px 50px rgba(0,0,0,0.6); position: relative; }
        input { width: 100%; background: #000; border: 1px solid rgba(255,255,255,0.1); padding: 14px; border-radius: 12px; color: #fff; margin-bottom: 12px; outline: none; text-align: center; font-size: 1rem; }
        input:focus { border-color: var(--blue); }
        button { width: 100%; background: linear-gradient(135deg, var(--blue), var(--purple)); color: #000; border: none; padding: 14px; border-radius: 12px; font-weight: bold; cursor: pointer; text-transform: uppercase; margin-bottom: 20px; font-size: 0.95rem; }
        .f-row { background: rgba(0,0,0,0.4); border: 1px solid rgba(255,255,255,0.05); padding: 12px; border-radius: 12px; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; }
        .btn-duel { background: var(--pink); color: #fff; border: none; padding: 6px 12px; border-radius: 8px; font-size: 0.8rem; font-weight: bold; cursor: pointer; text-transform: uppercase; }
        .btn-menu { display: block; width: 100%; background: #fff; color: #000; padding: 14px; border-radius: 12px; font-weight: bold; text-decoration: none; text-transform: uppercase; font-size: 0.95rem; }
        
        /* ВСплывающее ОКНО ПРИГЛАШЕНИЯ */
        .invite-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 999; align-items: center; justify-content: center; }
        .invite-modal { background: #0c112b; border: 2px solid var(--pink); border-radius: 20px; padding: 25px; text-align: center; max-width: 320px; width: 100%; box-shadow: 0 0 30px var(--pink); }
        .invite-modal h4 { font-size: 1.2rem; color: var(--pink); margin-bottom: 15px; text-transform: uppercase; }
        .invite-btns { display: flex; gap: 10px; margin-top: 20px; }
        .btn-modal { flex: 1; padding: 10px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; text-transform: uppercase; }
    </style>
</head>
<body>

    <div class="box">
        <h2 style="margin-bottom:20px; text-transform: uppercase; font-weight: 900; letter-spacing: 1px;">👥 Сигма Дуэли</h2>
        <input type="text" id="f-id-input" placeholder="Введи Сигма-ID друга...">
        <button onclick="addFriend()">Вызвать на баттл</button>
        
        <div style="text-align: left; margin-bottom: 10px; font-size: 0.85rem; color: #5c6c8f; font-weight: bold; text-transform: uppercase;">Твоё лобби:</div>
        <div id="f-list" style="margin-bottom: 20px;"></div>
        
        <a href="index.html" class="btn-menu">В меню</a>
    </div>

    <!-- ОКНО ДЛЯ ПРИНЯТИЯ ИНВАЙТА -->
    <div class="invite-overlay" id="invite-overlay">
        <div class="invite-modal">
            <h4>ВЫЗОВ НА ДУЭЛЬ! ⚔️</h4>
            <p id="invite-text">Сигма-Бро бросил тебе вызов на арене!</p>
            <div class="invite-btns">
                <button class="btn-modal" style="background:var(--success); color:#000;" onclick="acceptInvite()">Принять</button>
                <button class="btn-modal" style="background:var(--danger); color:#fff;" onclick="rejectInvite()">Отклонить</button>
            </div>
        </div>
    </div>

    <script>
        function renderFriends() {
            var list = JSON.parse(localStorage.getItem('fl_friends_list')) || [];
            var html = "";
            list.forEach(function(id) { 
                html += '<div class="f-row"><div>🟢 Бро <span style="color:var(--blue); font-weight:bold;">#' + id + '</span></div><button class="btn-duel" onclick="sendInvite(' + id + ')">⚔️ Дуэль</button></div>'; 
            });
            document.getElementById('f-list').innerHTML = html || '<p style="color:#5c6c8f; font-size:0.9rem;">Лобби пусто. Добавь друга по ID!</p>';
        }

        function addFriend() {
            var val = document.getElementById('f-id-input').value.trim();
            if(!val || val.length !== 6 || isNaN(val)) { alert("Введите правильный 6-значный ID друга!"); return; }
            var list = JSON.parse(localStorage.getItem('fl_friends_list')) || [];
            if(!list.includes(val)) { list.push(val); localStorage.setItem('fl_friends_list', JSON.stringify(list)); }
            document.getElementById('f-id-input').value = "";
            renderFriends();
        }

        // Имитация отправки приглашения
        function sendInvite(id) {
            alert("✉️ Приглашение на дуэль отправлено игроку #" + id + "! Ожидаем ответа...");
            // Симулируем, что друг получил инвайт и открывается окно инвайта
            setTimeout(function() {
                document.getElementById('invite-text').innerText = "Сигма-Игрок #" + id + " принял вызов! Нажмите 'Принять' для входа на арену.";
                document.getElementById('invite-overlay').style.display = 'flex';
            }, 1500);
        }

        function acceptInvite() {
            localStorage.setItem('fl_is_pvp_mode', 'true'); // Включаем режим честного PvP
            window.location.href = 'arena.html';
        }

        function rejectInvite() {
            document.getElementById('invite-overlay').style.display = 'none';
        }

        renderFriends();
    </script>
</body>
</html>
