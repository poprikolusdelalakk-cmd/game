<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FLUENT ARENA - СЕТЕВОЙ ВЫЗОВ</title>
    <script src="https://unpkg.com"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: #060b13; color: white;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex; justify-content: center; align-items: center; min-height: 100vh;
        }
        .menu-card {
            background: #0d1625; border: 2px solid #1e293b; border-radius: 20px;
            padding: 30px; width: 90%; max-width: 420px; text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.6);
        }
        h2 { font-size: 24px; margin-bottom: 20px; text-transform: uppercase; letter-spacing: 1px; color: #38bdf8; }
        input {
            width: 100%; padding: 14px; background: #111827; border: 2px solid #1e293b;
            border-radius: 12px; color: white; font-size: 16px; text-align: center; margin-bottom: 15px; outline: none;
        }
        input:focus { border-color: #a855f7; }
        .btn {
            width: 100%; padding: 14px; border: none; border-radius: 12px; font-size: 16px;
            font-weight: 700; cursor: pointer; color: white; margin-bottom: 12px; transition: 0.2s;
        }
        .btn-primary { background: linear-gradient(135deg, #a855f7 0%, #ec4899 100%); }
        .btn-bot { background: linear-gradient(135deg, #06b6d4 0%, #3b82f6 100%); }
        .btn-secondary { background: #1e293b; }
        .status { font-size: 13px; color: #94a3b8; margin-top: 5px; margin-bottom: 15px; }
    </style>
</head>
<body>

    <div class="menu-card">
        <h2>⚔️ Сетевой Вызов</h2>
        
        <!-- Отображение личного Сигма-ID игрока -->
        <div style="background: rgba(56,189,248,0.1); padding: 10px; border-radius: 10px; margin-bottom: 15px; border: 1px dashed #38bdf8;">
            Ваш Сигма-ID: <b id="my-id-display" style="color: #38bdf8; font-size: 18px;">------</b>
        </div>

        <input type="text" id="friend-id-input" placeholder="Введите Сигма-ID друга...">
        
        <button class="btn btn-primary" onclick="sendInvite()">ДОБАВИТЬ И ОТПРАВИТЬ ИНВАЙТ</button>
        <button class="btn btn-bot" onclick="playWithBot()">ОДИНОЧНАЯ ИГРА С БОТОМ</button>
        <button class="btn btn-secondary" onclick="window.location.href='index.html'">В МЕНЮ</button>

        <div class="status" id="status-text">Готов к передаче инвайтов в сеть</div>
    </div>

    <script>
        // Генерируем или берем постоянный ID игрока
        let myId = localStorage.getItem('sigma_id');
        if(!myId) {
            myId = Math.floor(100000 + Math.random() * 900000).toString();
            localStorage.setItem('sigma_id', myId);
        }
        document.getElementById('my-id-display').textContent = myId;

        // Подключаемся к общему брокеру для отслеживания входящих инвайтов
        const client = mqtt.connect('wss://test.mosquitto.org:8081');
        
        client.on('connect', () => {
            // Слушаем личный канал инвайтов по своему ID
            client.subscribe(`fluentarena/invite/${myId}`);
        });

        client.on('message', (topic, message) => {
            let data = JSON.parse(message.toString());
            document.getElementById('status-text').textContent = `Получен инвайт от ${data.from}! Входим в бой...`;
            
            // Если пришел инвайт, гость переходит по ссылке создателя (host)
            setTimeout(() => {
                window.location.href = `arena.html?mode=online&role=guest&room=${data.room}`;
            }, 1000);
        });

        // Отправка вызова другу
        function sendInvite() {
            let friendId = document.getElementById('friend-id-input').value.trim();
            if(!friendId || friendId.length < 5) {
                alert('Пожалуйста, введите корректный ID друга!');
                return;
            }

            let roomName = `room_${myId}_${friendId}`;
            document.getElementById('status-text').textContent = 'Ожидание ответа от игрока...';

            // Публикуем инвайт в топик друга
            client.publish(`fluentarena/invite/${friendId}`, JSON.stringify({
                from: localStorage.getItem('nickname') || 'Flerenk',
                room: roomName
            }));

            // Сами переходим в режим ожидания (как хост)
            setTimeout(() => {
                window.location.href = `arena.html?mode=online&role=host&room=${roomName}`;
            }, 1500);
        }

        // Кнопка быстрого запуска игры с ботом
        function playWithBot() {
            window.location.href = `arena.html?mode=bot`;
        }
    </script>
</body>
</html>
