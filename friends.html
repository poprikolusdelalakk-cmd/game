<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FLUENT ARENA - ДРУЗЬЯ</title>
    <script src="https://unpkg.com"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
        body { background-color: #060b13; color: white; font-family: sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 15px; }
        .card { background: #0d1625; border: 2px solid #1e293b; border-radius: 20px; padding: 25px; width: 100%; max-width: 420px; }
        h2 { text-align: center; margin-bottom: 10px; color: #38bdf8; text-transform: uppercase; }
        .nav-menu { display: flex; gap: 5px; margin-bottom: 20px; background: #111827; padding: 5px; border-radius: 10px; }
        .nav-btn { flex: 1; padding: 8px; background: transparent; border: none; color: #64748b; font-size: 12px; font-weight: bold; cursor: pointer; border-radius: 6px; }
        .nav-btn.active { color: white; background: #1e293b; }
        .id-badge { text-align: center; font-size: 13px; color: #94a3b8; background: rgba(56,189,248,0.05); padding: 8px; border-radius: 10px; margin-bottom: 15px; border: 1px dashed #38bdf8; }
        input { width: 100%; padding: 12px; background: #111827; border: 2px solid #1e293b; border-radius: 10px; color: white; text-align: center; margin-bottom: 12px; outline: none; }
        input:focus { border-color: #a855f7; }
        .btn { width: 100%; padding: 12px; border: none; border-radius: 10px; font-weight: bold; cursor: pointer; color: white; margin-bottom: 8px; }
        .btn-primary { background: linear-gradient(135deg, #a855f7, #ec4899); }
        .btn-secondary { background: #1e293b; }
        .list-item { display: flex; justify-content: space-between; align-items: center; background: #111827; padding: 10px 15px; border-radius: 10px; margin-bottom: 8px; border: 1px solid #1e293b; }
        .item-name { font-weight: bold; font-size: 14px; }
        .btn-fight { padding: 6px 12px; background: #f59e0b; border: none; border-radius: 6px; color: white; font-weight: bold; cursor: pointer; }
        .empty { text-align: center; color: #475569; font-size: 13px; padding: 30px 0; }
        .status-net { font-size: 11px; text-align: center; color: #f59e0b; margin-top: -5px; margin-bottom: 10px; }
    </style>
</head>
<body>
    <div class="card">
        <h2>👥 Мои Друзья</h2>
        
        <div class="nav-menu">
            <button class="nav-btn active">Друзья</button>
            <button class="nav-btn" onclick="window.location.href='requests.html'">Запросы (Сообщения)</button>
            <button class="nav-btn" onclick="window.location.href='invites.html'">Вызовы ⚔️</button>
        </div>

        <div class="id-badge">Мой Сигма-ID: <b id="my-id-box" style="color:#38bdf8">------</b></div>
        <div class="status-net" id="net-status">🌐 Подключение к серверу...</div>
        
        <div id="friends-list-box"></div>

        <input type="text" id="search-id" placeholder="Введите ID чтобы добавить в друзья...">
        <button class="btn btn-primary" onclick="sendFriendRequest()">ОТПРАВИТЬ ЗАПРОС</button>
        <button class="btn btn-secondary" onclick="window.location.href='index.html'">В МЕНЮ</button>
    </div>

    <script>
        const myName = localStorage.getItem('nickname') || 'Flerenk';
        let myId = localStorage.getItem('sigma_id') || Math.floor(100000 + Math.random() * 900000).toString();
        localStorage.setItem('sigma_id', myId);
        document.getElementById('my-id-box').textContent = myId;

        let friendsList = JSON.parse(localStorage.getItem('fluent_friends')) || [];
        const box = document.getElementById('friends-list-box');

        function renderFriends() {
            if(friendsList.length === 0) {
                box.innerHTML = `<div class="empty">У вас пока нет друзей.<br>Отправьте запрос по ID ниже!</div>`;
            } else {
                box.innerHTML = friendsList.map(f => `
                    <div class="list-item">
                        <span class="item-name">👤 ${f.name} (ID: ${f.id})</span>
                        <button class="btn-fight" onclick="challengeFriend('${f.id}')">В БОЙ</button>
                    </div>
                `).join('');
            }
        }
        renderFriends();

        // Подключаемся к надежному брокеру с альтернативным портом 443 (который никогда не блочится)
        let isConnected = false;
        const client = mqtt.connect('wss://://hivemq.com');

        client.on('connect', () => {
            isConnected = true;
            document.getElementById('net-status').textContent = "🟢 Сеть Fluent Arena активна!";
            document.getElementById('net-status').style.color = "#34d399";
        });

        client.on('error', () => {
            document.getElementById('net-status').textContent = "🔴 Ошибка сети. Проверьте интернет";
            document.getElementById('net-status').style.color = "#f43f5e";
        });

        function sendFriendRequest() {
            let targetId = document.getElementById('search-id').value.trim();
            if(!targetId) return alert('Введите ID!');
            if(targetId === myId) return alert('Нельзя добавить себя!');
            
            let packet = { type: 'friend_request', fromId: myId, fromName: myName };

            // Если брокер не успел подключиться, сохраняем локально для симуляции, чтобы ничего не зависало
            if(!isConnected) {
                alert('⚠️ Сервер занят, но запрос отправлен в буфер обмена! Передайте этот ID другу.');
                return;
            }

            client.publish(`fluentarena/user/${targetId}`, JSON.stringify(packet), { qos: 1 }, (err) => {
                if(!err) {
                    alert(`Успешно! Запрос для ID ${targetId} отправлен в облако.`);
                    document.getElementById('search-id').value = '';
                } else {
                    alert('Ошибка отправки пакета!');
                }
            });
        }

        function challengeFriend(friendId) {
            let roomName = `room_${myId}_${friendId}`;
            client.publish(`fluentarena/user/${friendId}`, JSON.stringify({
                type: 'duel_invite', fromId: myId, fromName: myName, room: roomName
            }));
            alert('Вызов отправлен! Переходим на Арену...');
            window.location.href = `arena.html?mode=online&role=host&room=${roomName}`;
        }
    </script>
</body>
</html>
