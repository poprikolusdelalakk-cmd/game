<!DOCTYPE html>
<html lang="ru" translate="no" class="notranslate">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fluent Arena - Вызов на бой</title>
    <style>
        :root { --bg: #02040a; --card: rgba(14, 22, 47, 0.85); --blue: #00f2fe; --purple: #9d4edd; --success: #00ff66; --pink: #ff007f; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
        body { background: radial-gradient(circle at center, #0c112b 0%, var(--bg) 100%); color: #fff; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
        .box { background: var(--card); border: 1px solid rgba(0,242,254,0.2); border-radius: 24px; padding: 30px; max-width: 400px; width: 100%; text-align: center; box-shadow: 0 20px 50px rgba(0,0,0,0.6); }
        input { width: 100%; background: #000; border: 1px solid rgba(255,255,255,0.1); padding: 14px; border-radius: 12px; color: #fff; margin-bottom: 12px; outline: none; text-align: center; font-size: 1rem; }
        button { width: 100%; background: linear-gradient(135deg, var(--blue), var(--purple)); color: #000; border: none; padding: 14px; border-radius: 12px; font-weight: bold; cursor: pointer; text-transform: uppercase; margin-bottom: 20px; }
        .f-row { background: rgba(0,0,0,0.4); border: 1px solid rgba(255,255,255,0.05); padding: 12px; border-radius: 12px; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; }
        .btn-duel { background: var(--pink); color: #fff; border: none; padding: 8px 14px; border-radius: 8px; font-size: 0.8rem; font-weight: bold; cursor: pointer; text-transform: uppercase; }
        .btn-menu { display: block; width: 100%; background: #fff; color: #000; padding: 14px; border-radius: 12px; font-weight: bold; text-decoration: none; text-transform: uppercase; text-align: center; }
        
        .invite-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); z-index: 999; align-items: center; justify-content: center; }
        .invite-modal { background: #0c112b; border: 2px solid var(--pink); border-radius: 20px; padding: 25px; text-align: center; max-width: 340px; width: 100%; box-shadow: 0 0 30px var(--pink); }
        .invite-btns { display: flex; gap: 10px; margin-top: 20px; }
        .btn-modal { flex: 1; padding: 12px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; text-transform: uppercase; }
    </style>
</head>
<body>

    <div class="box">
        <h2 style="margin-bottom:20px; text-transform: uppercase; font-weight: 900;">⚔️ БАТТЛ С ДРУГОМ</h2>
        <input type="text" id="f-nick-input" placeholder="Введите Никнейм друга...">
        <input type="text" id="f-id-input" placeholder="Введите Сигма-ID друга...">
        <button onclick="addFriend()">Вызвать Бро</button>
        
        <div style="text-align: left; margin-bottom: 10px; font-size: 0.85rem; color: #5c6c8f; font-weight: bold;">ТВОИ ДРУЗЬЯ В СЕТИ:</div>
        <div id="f-list" style="margin-bottom: 20px;"></div>
        
        <a href="index.html" class="btn-menu">Назад в меню</a>
    </div>

    <!-- ОКНО ИНВАЙТА ДЛЯ ДУЭЛИ -->
    <div class="invite-overlay" id="invite-overlay">
        <div class="invite-modal">
            <h3 style="color:var(--pink); margin-bottom:10px;">ВЫЗОВ НА ДУЭЛЬ! ⚔️</h3>
            <p id="invite-text">Твой друг готов сразиться!</p>
            <div class="invite-btns">
                <button class="btn-modal" style="background:var(--success); color:#000;" onclick="acceptInvite()">ПОГНАЛИ БИТЬСЯ</button>
                <button class="btn-modal" style="background:var(--danger); color:#fff;" onclick="rejectInvite()">ОТКЛОНИТЬ</button>
            </div>
        </div>
    </div>

    <script>
        var myNick = localStorage.getItem('fl_user_nick') || "Nazar";

        function renderFriends() {
            var list = JSON.parse(localStorage.getItem('fl_friends_complex')) || [];
            var html = "";
            list.forEach(function(friend) { 
                html += '<div class="f-row"><div>🟢 <strong style="color:#fff">' + friend.nick + '</strong> <span style="color:var(--blue); font-size:0.8rem;">#' + friend.id + '</span></div><button class="btn-duel" onclick="sendInvite(\'' + friend.nick + '\')">Вызов</button></div>'; 
            });
            document.getElementById('f-list').innerHTML = html || '<p style="color:#5c6c8f; font-size:0.9rem;">Список пуст. Добавь друга по Нику и ID!</p>';
        }

        function addFriend() {
            var nickVal = document.getElementById('f-nick-input').value.trim();
            var idVal = document.getElementById('f-id-input').value.trim();
            if(!nickVal || idVal.length !== 6 || isNaN(idVal)) { alert("Заполни Ник и 6-значный ID друга корректно!"); return; }
            
            var list = JSON.parse(localStorage.getItem('fl_friends_complex')) || [];
            
            // Проверка дубликатов
            var exists = list.some(function(f) { return friend.id === idVal; });
            if(!exists) {
                list.push({ nick: nickVal, id: idVal });
                localStorage.setItem('fl_friends_complex', JSON.stringify(list));
            }
            
            document.getElementById('f-nick-input').value = "";
            document.getElementById('f-id-input').value = "";
            renderFriends();
        }

        function sendInvite(friendNick) {
            localStorage.setItem('enemy_player_name', friendNick); // Передаем ник друга в игру
            document.getElementById('invite-text').innerText = "Сигма-Игрок " + friendNick + " принял твой вызов! Вы готовы начать настоящий PvP бой?";
            document.getElementById('invite-overlay').style.display = 'flex';
        }

        function acceptInvite() {
            window.location.href = 'arena.html';
        }

        function rejectInvite() {
            document.getElementById('invite-overlay').style.display = 'none';
        }

        renderFriends();
    </script>
</body>
</html>
