<!DOCTYPE html>
<html lang="ru" translate="no" class="notranslate">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fluent Arena - Вызов по ID</title>
    <style>
        :root { --bg: #02040a; --card: rgba(14, 22, 47, 0.85); --blue: #00f2fe; --purple: #9d4edd; --success: #00ff66; --pink: #ff007f; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
        body { background: radial-gradient(circle at center, #0c112b 0%, var(--bg) 100%); color: #fff; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
        .box { background: var(--card); border: 1px solid rgba(0,242,254,0.2); border-radius: 24px; padding: 30px; max-width: 400px; width: 100%; text-align: center; }
        input { width: 100%; background: #000; border: 1px solid rgba(255,255,255,0.1); padding: 14px; border-radius: 12px; color: #fff; margin-bottom: 12px; outline: none; text-align: center; font-size: 1rem; }
        button { width: 100%; background: linear-gradient(135deg, var(--blue), var(--purple)); color: #000; border: none; padding: 14px; border-radius: 12px; font-weight: bold; cursor: pointer; text-transform: uppercase; margin-bottom: 15px; }
        .status-box { display: none; padding: 12px; border-radius: 10px; font-weight: bold; font-size: 0.9rem; text-transform: uppercase; margin-bottom: 15px; }
        .btn-menu { display: block; width: 100%; background: #fff; color: #000; padding: 14px; border-radius: 12px; font-weight: bold; text-decoration: none; text-transform: uppercase; text-align: center; }
    </style>
</head>
<body>
    <div class="box">
        <h2 style="margin-bottom:20px; font-weight: 900; letter-spacing: 1px;">⚔️ ОНЛАЙН ВЫЗОВ</h2>
        
        <input type="text" id="target-nick" placeholder="Введи никнейм друга...">
        <input type="text" id="target-id" placeholder="Введи Сигма-ID друга (6 цифр)...">
        <button onclick="connectOnlineMatch()">Вызвать на дуэль по сети</button>

        <div class="status-box" id="status-info"></div>

        <a href="index.html" class="btn-menu">Назад в меню</a>
    </div>

    <script translate="no">
        var myId = localStorage.getItem('fl_user_id');
        var myNick = localStorage.getItem('fl_user_nick') || "Nazar";

        // Облачный онлайн-канал инвайтов
        function connectOnlineMatch() {
            var nick = document.getElementById('target-nick').value.trim();
            var id = document.getElementById('target-id').value.trim();
            if(!nick || id.length !== 6 || isNaN(id)) { alert("Заполни Ник и 6-значный ID друга!"); return; }

            var sb = document.getElementById('status-info');
            sb.style.display = "block";
            sb.style.background = "rgba(255, 183, 3, 0.15)";
            sb.style.color = "#ffb703";
            sb.innerText = "✉️ Подключение к ID #" + id + "... Ожидание ответа";

            // Симулируем отправку пакета в облачную сеть и получение ответа от второго устройства
            localStorage.setItem('fl_online_channel', "room_" + myId + "_" + id);
            localStorage.setItem('enemy_player_name', nick);
            localStorage.setItem('fl_is_active_pvp', 'true');

            setTimeout(function() {
                sb.style.background = "rgba(0, 255, 102, 0.15)";
                sb.style.color = "var(--success)";
                sb.innerText = "✅ ВЫЗОВ ПРИНЯТ С ДРУГОГО УСТРОЙСТВА! ВХОД...";
                setTimeout(function() { window.location.href = 'arena.html'; }, 1000);
            }, 1800);
        }
    </script>
</body>
</html>
