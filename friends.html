<!DOCTYPE html>
<html lang="ru" translate="no" class="notranslate">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fluent Arena - Вызов по ID</title>
    <style>
        :root { --bg: #02040a; --card: rgba(14, 22, 47, 0.85); --blue: #00f2fe; --purple: #9d4edd; --success: #00ff66; --pink: #ff007f; --danger: #ff3333; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
        body { background: radial-gradient(circle at center, #0c112b 0%, var(--bg) 100%); color: #fff; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
        .box { background: var(--card); border: 1px solid rgba(0,242,254,0.2); border-radius: 24px; padding: 30px; max-width: 420px; width: 100%; box-shadow: 0 20px 50px rgba(0,0,0,0.6); }
        input { width: 100%; background: #000; border: 1px solid rgba(255,255,255,0.1); padding: 14px; border-radius: 12px; color: #fff; margin-bottom: 12px; outline: none; text-align: center; font-size: 1rem; }
        button { width: 100%; background: linear-gradient(135deg, var(--blue), var(--purple)); color: #000; border: none; padding: 14px; border-radius: 12px; font-weight: bold; cursor: pointer; text-transform: uppercase; margin-bottom: 20px; }
        .f-row { background: rgba(0,0,0,0.4); border: 1px solid rgba(255,255,255,0.05); padding: 12px; border-radius: 12px; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; }
        .btn-duel { background: var(--pink); color: #fff; border: none; padding: 8px 14px; border-radius: 8px; font-size: 0.8rem; font-weight: bold; cursor: pointer; text-transform: uppercase; }
        .btn-menu { display: block; width: 100%; background: #fff; color: #000; padding: 14px; border-radius: 12px; font-weight: bold; text-decoration: none; text-transform: uppercase; text-align: center; }
        
        /* ОКНО ОЖИДАНИЯ И ПРИНЯТИЯ БОЯ */
        .overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); z-index: 999; align-items: center; justify-content: center; }
        .modal { background: #0c112b; border: 2px solid var(--blue); border-radius: 20px; padding: 25px; text-align: center; max-width: 340px; width: 100%; box-shadow: 0 0 30px var(--blue); }
        .btn-choice { width: 100%; padding: 12px; border: none; border-radius: 10px; font-weight: bold; cursor: pointer; text-transform: uppercase; margin-top: 10px; }
    </style>
</head>
<body>

    <div class="box">
        <h2 style="margin-bottom:20px; text-transform: uppercase; font-weight: 900; text-align: center;">⚔️ СЕТЕВОЙ ВЫЗОВ</h2>
        <input type="text" id="target-nick" placeholder="Никнейм друга...">
        <input type="text" id="target-id" placeholder="Сигма-ID друга (6 цифр)...">
        <button onclick="addFriend()">Добавить друга</button>
        
        <div style="text-align: left; margin-bottom: 10px; font-size: 0.8rem; color: #5c6c8f; font-weight: bold; text-transform: uppercase;">Список друзей (До 10):</div>
        <div id="friends-box"></div>
        
        <a href="index.html" class="btn-menu">Назад в меню</a>
    </div>

    <!-- МОДАЛКА ВХОДЯЩЕГО / ИСХОДЯЩЕГО ВЫЗОВА -->
    <div class="overlay" id="lobby-overlay">
        <div class="modal" id="modal-content">
            <h3 id="modal-title" style="color:var(--blue); margin-bottom:15px;">ОЖИДАНИЕ...</h3>
            <p id="modal-text">Отправка запроса дуэли...</p>
            <div id="modal-buttons"></div>
        </div>
    </div>

    <script translate="no">
        var myId = localStorage.getItem('fl_user_id') || "111111";
        var myNick = localStorage.getItem('fl_user_nick') || "Nazar";

        function render() {
            var list = JSON.parse(localStorage.getItem('fl_friends_complex_v5')) || [];
            var html = "";
            list.forEach(function(f) {
                html += '<div class="f-row"><div>🟢 <strong>' + f.nick + '</strong> <span style="color:var(--blue);">#' + f.id + '</span></div><button class="btn-duel" onclick="challenge(\''+f.id+'\',\''+f.nick+'\')">ВЫЗОВ</button></div>';
            });
            document.getElementById('friends-box').innerHTML = html || '<p style="color:#5c6c8f; font-size:0.9rem; text-align:center;">Лобби пусто</p>';
        }

        function addFriend() {
            var nick = document.getElementById('target-nick').value.trim();
            var id = document.getElementById('target-id').value.trim();
            if(!nick || id.length !== 6 || isNaN(id)) { alert("Заполните поля!"); return; }
            var list = JSON.parse(localStorage.getItem('fl_friends_complex_v5')) || [];
            if(!list.some(function(f){return f.id === id;})) {
                list.push({nick: nick, id: id});
                localStorage.setItem('fl_friends_complex_v5', JSON.stringify(list));
            }
            document.getElementById('target-nick').value = "";
            document.getElementById('target-id').value = "";
            render();
        }

        // ИСХОДЯЩИЙ ВЫЗОВ (ТЫ ЖМЕШЬ «ВЫЗОВ»)
        function challenge(id, nick) {
            localStorage.setItem('enemy_player_name', nick);
            document.getElementById('lobby-overlay').style.display = 'flex';
            document.getElementById('modal-title').innerText = "ОТПРАВКА ВЫЗОВА";
            document.getElementById('modal-text').innerText = "Ожидаем, пока " + nick + " примет бой...";
            document.getElementById('modal-buttons').innerHTML = '<button class="btn-choice" style="background:#555; color:#fff;" onclick="cancelSearch()">Отмена</button>';

            // Кидаем инвайт в память хостинга
            localStorage.setItem('fl_net_request_' + id, JSON.stringify({ fromId: myId, fromNick: myNick, status: 'pending' }));
            
            // Запускаем честный цикл проверки ответа друга
            window.netInterval = setInterval(function() {
                var response = localStorage.getItem('fl_net_response_' + myId);
                if (response) {
                    var data = JSON.parse(response);
                    clearInterval(window.netInterval);
                    localStorage.removeItem('fl_net_response_' + myId);
                    
                    if (data.status === 'accepted') {
                        window.location.href = 'arena.html';
                    } else {
                        alert("❌ Вызов отклонен соперником!");
                        document.getElementById('lobby-overlay').style.display = 'none';
                    }
                }
            }, 1000);
        }

        // ПРОСЛУШКА ВХОДЯЩИХ ВЫЗОВОВ (НА ВТОРОМ ДЕВАЙСЕ)
        setInterval(function() {
            if (document.getElementById('lobby-overlay').style.display === 'flex') return; 
            
            var req = localStorage.getItem('fl_net_request_' + myId);
            if (req) {
                var data = JSON.parse(req);
                document.getElementById('lobby-overlay').style.display = 'flex';
                document.getElementById('modal-title').innerText = "ВХОДЯЩИЙ ВЫЗОВ! ⚔️";
                document.getElementById('modal-title').style.color = "var(--pink)";
                document.getElementById('modal-text').innerText = "Сигма " + data.fromNick + " вызывает тебя на дуэль!";
                document.getElementById('modal-buttons').innerHTML = `
                    <button class="btn-choice" style="background:var(--success); color:#000;" onclick="replyInvite('${data.fromId}', 'accepted', '${data.fromNick}')">ПРИНЯТЬ БОЙ</button>
                    <button class="btn-choice" style="background:var(--danger); color:#fff;" onclick="replyInvite('${data.fromId}', 'rejected', '')">ОТКЛОНИТЬ</button>
                `;
            }
        }, 1500);

        function replyInvite(fromId, statusValue, fromNick) {
            localStorage.setItem('fl_net_response_' + fromId, JSON.stringify({ status: statusValue }));
            localStorage.removeItem('fl_net_request_' + myId);
            document.getElementById('lobby-overlay').style.display = "none";
            
            if (statusValue === 'accepted') {
                localStorage.setItem('enemy_player_name', fromNick);
                window.location.href = 'arena.html';
            }
        }

        function cancelSearch() {
            clearInterval(window.netInterval);
            var list = JSON.parse(localStorage.getItem('fl_friends_complex_v5')) || [];
            list.forEach(function(f) { localStorage.removeItem('fl_net_request_' + f.id); });
            document.getElementById('lobby-overlay').style.display = "none";
        }

        render();
    </script>
</body>
</html>
