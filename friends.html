<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Список Друзей</title>
    <style>
        body { background: #02040a; color: #fff; font-family: sans-serif; display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 20px; }
        .box { background: rgba(14,22,47,0.85); border: 1px solid rgba(0,242,254,0.2); border-radius: 20px; padding: 30px; max-width: 400px; width: 100%; text-align: center; }
        input { width: 100%; background: #000; border: 1px solid rgba(255,255,255,0.1); padding: 12px; border-radius: 10px; color: #fff; margin-bottom: 12px; outline: none; text-align: center; }
        button { width: 100%; background: #00f2fe; color: #000; border: none; padding: 12px; border-radius: 10px; font-weight: bold; cursor: pointer; text-transform: uppercase; margin-bottom: 15px; }
        .f-row { background: rgba(0,255,102,0.05); border: 1px solid rgba(0,255,102,0.15); padding: 10px; border-radius: 8px; margin-bottom: 6px; color: #00ff66; text-align: left; font-size: 0.9rem; font-weight: bold; }
        .btn-menu { display: block; background: #fff; color: #000; padding: 14px; border-radius: 12px; font-weight: bold; text-decoration: none; text-transform: uppercase; }
    </style>
</head>
<body>
    <div class="box">
        <h2 style="margin-bottom:20px;">👥 ДРУЗЬЯ ПО СИГМА-ID</h2>
        <input type="text" id="f-id-input" placeholder="Введите ID друга (6 цифр)...">
        <button onclick="addF()">Добавить в лобби</button>
        <div id="f-list"></div>
        <a href="index.html" class="btn-menu">В меню</a>
    </div>
    <script>
        function renderF() {
            var list = JSON.parse(localStorage.getItem('fl_friends_list')) || [];
            var html = "";
            list.forEach(function(id) { html += '<div class="f-row">🟢 Сигма-Бро [ID: ' + id + '] — В СЕТИ</div>'; });
            document.getElementById('f-list').innerHTML = html;
        }
        function addF() {
            var val = document.getElementById('f-id-input').value.trim();
            if(!val || isNaN(val) || val.length !== 6) { alert("Введите корректный 6-значный ID!"); return; }
            var list = JSON.parse(localStorage.getItem('fl_friends_list')) || [];
            if(!list.includes(val)) { list.push(val); localStorage.setItem('fl_friends_list', JSON.stringify(list)); }
            document.getElementById('f-id-input').value = "";
            renderF();
        }
        renderF();
    </script>
</body>
</html>
