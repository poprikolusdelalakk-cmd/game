<!DOCTYPE html>
<html lang="ru" translate="no" class="notranslate">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fluent Arena - Сетевой вызов</title>
    <style>
        :root { --bg: #02040a; --card: rgba(14, 22, 47, 0.85); --blue: #00f2fe; --purple: #9d4edd; --pink: #ff007f; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
        body { background: radial-gradient(circle at center, #0c112b 0%, var(--bg) 100%); color: #fff; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
        .box { background: var(--card); border: 1px solid rgba(0,242,254,0.2); border-radius: 24px; padding: 30px; max-width: 400px; width: 100%; text-align: center; box-shadow: 0 20px 50px rgba(0,0,0,0.6); }
        input { width: 100%; background: #000; border: 1px solid rgba(255,255,255,0.1); padding: 14px; border-radius: 12px; color: #fff; margin-bottom: 12px; outline: none; text-align: center; font-size: 1rem; }
        button { width: 100%; background: linear-gradient(135deg, var(--blue), var(--purple)); color: #000; border: none; padding: 14px; border-radius: 12px; font-weight: bold; cursor: pointer; text-transform: uppercase; margin-bottom: 20px; }
        .f-row { background: rgba(0,0,0,0.4); border: 1px solid rgba(255,255,255,0.05); padding: 12px; border-radius: 12px; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; }
        .btn-duel { background: var(--pink); color: #fff; border: none; padding: 8px 14px; border-radius: 8px; font-size: 0.8rem; font-weight: bold; cursor: pointer; text-transform: uppercase; }
        .btn-menu { display: block; width: 100%; background: #fff; color: #000; padding: 14px; border-radius: 12px; font-weight: bold; text-decoration: none; text-transform: uppercase; text-align: center; }
    </style>
</head>
<body>
    <div class="box">
        <h2 style="margin-bottom:20px; font-weight: 900; text-transform: uppercase;">⚔️ Сетевой Вызов</h2>
        <input type="text" id="friend-nick" placeholder="Введи никнейм друга...">
        <input type="text" id="friend-id" placeholder="Введи Сигма-ID друга (6 цифр)...">
        <button onclick="addAndChallenge()">Добавить и Отправить инвайт</button>
        
        <div style="text-align: left; margin-bottom: 10px; font-size: 0.85rem; color: #5c6c8f; font-weight: bold;">ТВОЙ СПИСОК ДРУЗЕЙ (ДО 10):</div>
        <div id="friends-box"></div>
        <a href="index.html" class="btn-menu" style="margin-top:10px;">В меню</a>
    </div>

    <script>
        function render() {
            var list = JSON.parse(localStorage.getItem('fl_friends_list_complex')) || [];
            var html = "";
            list.forEach(function(f) {
                html += '<div class="f-row"><div>🟢 <strong>' + f.nick + '</strong> <span style="color:var(--blue);">#' + f.id + '</span></div><button class="btn-duel" onclick="challenge(\''+f.nick+'\',\''+f.id+'\')">Вызов</button></div>';
            });
            document.getElementById('friends-box').innerHTML = html || '<p style="color:#5c6c8f; font-size:0.9rem;">Список пуст. Добавь друга по ID!</p>';
        }

        function addAndChallenge() {
            var nick = document.getElementById('friend-nick').value.trim();
            var id = document.getElementById('friend-id').value.trim();
            if(!nick || id.length !== 6 || isNaN(id)) { alert("Заполните ник и 6-значный ID!"); return; }

            var list = JSON.parse(localStorage.getItem('fl_friends_list_complex')) || [];
            if(!list.some(function(f){ return f.id === id; })) {
                list.push({ nick: nick, id: id });
                localStorage.setItem('fl_friends_list_complex', JSON.stringify(list));
            }
            challenge(nick, id);
        }

        function challenge(friendNick, friendId) {
            localStorage.setItem('enemy_player_name', friendNick);
            localStorage.setItem('enemy_player_id', friendId);
            // ЖЕСТКИЙ ПЕРЕХОД НА НОВУЮ ВКЛАДКУ ОЖИДАНИЯ ОТВЕТА
            window.location.href = 'wait.html';
        }
        render();
    </script>
</body>
</html>
