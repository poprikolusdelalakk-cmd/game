<!DOCTYPE html>
<html lang="ru" translate="no" class="notranslate">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="google" content="notranslate">
    <title>Fluent Game - Кибер Джинн</title>
    <style>
        :root {
            --bg-space: #060919;
            --card-bg: rgba(13, 18, 38, 0.75);
            --neon-blue: #00f2fe;
            --neon-purple: #9d4edd;
            --neon-pink: #ff007f;
            --text-main: #ffffff;
            --text-muted: #6f7f9f;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
        body, html { 
            background: radial-gradient(circle at center, #12183a 0%, var(--bg-space) 100%); 
            color: var(--text-main); 
            width: 100%; height: 100%; overflow: hidden; 
            display: flex; align-items: center; justify-content: center;
        }
        .space-bg {
            position: absolute; width: 100%; height: 100%; top: 0; left: 0; z-index: 1;
            background-image: radial-gradient(white, rgba(255,255,255,.2) 2px, transparent 40px);
            background-size: 550px 550px; opacity: 0.2;
        }
        .wrapper { position: relative; z-index: 10; width: 100%; max-width: 460px; padding: 20px; }
        .game-card {
            background: var(--card-bg); border: 1px solid rgba(0, 242, 254, 0.2); border-radius: 24px;
            padding: 35px 25px; text-align: center; backdrop-filter: blur(15px);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
        }
        .genie-sphere-box { width: 120px; height: 140px; margin: 0 auto 25px auto; }
        .genie-sphere {
            width: 120px; height: 120px; border-radius: 50%;
            background: radial-gradient(circle at 30% 30%, var(--neon-blue) 0%, var(--neon-purple) 70%, #000 100%);
            box-shadow: 0 0 30px var(--neon-blue), 0 0 50px var(--neon-purple);
            animation: floatGlow 3s ease-in-out infinite;
        }
        @keyframes floatGlow {
            0% { transform: translateY(0px); filter: brightness(1); }
            50% { transform: translateY(-8px); filter: brightness(1.2); }
            100% { transform: translateY(0px); filter: brightness(1); }
        }
        .bubble-text { font-size: 1.15rem; font-weight: bold; line-height: 1.5; min-height: 65px; margin-bottom: 30px; color: #fff; }
        
        .answers-grid { display: flex; flex-direction: column; gap: 10px; }
        .btn-choice {
            background: rgba(255, 255, 255, 0.03); border: 1px solid rgba(255, 255, 255, 0.08);
            color: #fff; padding: 14px; border-radius: 12px; font-size: 1rem; font-weight: bold;
            cursor: pointer; transition: all 0.2s;
        }
        .btn-choice:hover { background: rgba(0, 242, 254, 0.1); border-color: var(--neon-blue); box-shadow: 0 0 10px rgba(0, 242, 254, 0.2); }
        
        .input-fail { width: 100%; background: rgba(0,0,0,0.3); border: 1px solid rgba(255,255,255,0.1); padding: 14px; border-radius: 12px; color: #fff; margin-bottom: 15px; text-align: center; font-size: 1rem; }
        .btn-action { background: var(--neon-blue); color: #000; border: none; padding: 14px; border-radius: 12px; font-size: 1rem; font-weight: bold; cursor: pointer; text-transform: uppercase; width: 100%; }
    </style>
</head>
<body>
    <div class="space-bg"></div>
    <div class="wrapper">
        <div class="game-card">
            <div class="genie-sphere-box"><div class="genie-sphere" id="sphere"></div></div>
            <div class="bubble-text" id="bubble">Загадай любого хайпового персонажа или блогера, а Джинн Fluent Game залезет к тебе в мысли!</div>
            <div id="buttons-area">
                <button class="btn-action" onclick="initEngine()">Начать катку</button>
            </div>
        </div>
    </div>
    <script translate="no">
        var step = 0;
        var log = {};

        var db = [
            { name: "Домер (Domer Grief)", tags: { game: "да", blogger: "да", domer: "да", blocks: "да" } },
            { name: "Компот", tags: { game: "да", blogger: "да", compot: "да", blocks: "да" } },
            { name: "Влад Бумага (А4)", tags: { real: "да", blogger: "да", a4: "да" } },
            { name: "Глент", tags: { real: "да", blogger: "да", glent: "да" } },
            { name: "Ивангай (EeOneGuy)", tags: { real: "да", blogger: "да", ivangay: "да" } },
            { name: "Леон (Бравл Старс)", tags: { game: "да", brawl: "да", legend: "да" } },
            { name: "Эдгар (Бравл Старс)", tags: { game: "да", brawl: "да", emo: "да" } },
            { name: "Меллстрой (Mellstroy)", tags: { real: "да", streamer: "да", money: "да" } },
            { name: "Бустер (Buster)", tags: { real: "да", streamer: "да", buster: "да" } },
            { name: "Скибиди Туалет", tags: { meme: "да", series: "да" } }
        ];

        var questions = [
            { id: "game", text: "Этот персонаж/блогер связан с видеоиграми?" },
            { id: "blogger", text: "Это реальный популярный блогер или ютубер?" },
            { id: "blocks", text: "Он прославился благодаря съёмкам игры Майнкрафт?" },
            { id: "domer", text: "Этот ютубер обожает снимать гриферские шоу, взламывать админки и владеет сервером ReallyWorld?" },
            { id: "compot", text: "Этот майнкрафтер живёт в культовой деревне жителей номер 13?" },
            { id: "a4", text: "Это лидер канала А4, у него миллионы подписчиков и фамилия Бумага?" },
            { id: "glent", text: "Этот парень раньше снимался на канале А4, а теперь у него свой канал «Глент Кобяков»?" },
            { id: "ivangay", text: "Это легендарный олдскульный блогер, который пел «Хаю-хай, с вами Ивангай»?" },
            { id: "brawl", text: "Этот перс из игры Brawl Stars?" },
            { id: "streamer", text: "Он проводит онлайн-трансляции (стримит)?" },
            { id: "meme", text: "Это просто мемный вирусный персонаж?" },
            { id: "legend", text: "Это лега в Бравле со способностью становиться невидимым?" },
            { id: "emo", text: "Он носит шарф, имеет эмо-прическу и прыгает на врагов с ульты?" },
            { id: "money", text: "Стример, который даёт безумные миллионные задания другим блогерам?" },
            { id: "buster", text: "Стример в очках, который кричит «Цезарь» и комментирует CS:GO?" },
            { id: "series", text: "У него голова торчит из унитаза?" }
        ];

        function initEngine() {
            step = 0;
            log = {};
            document.getElementById('sphere').style.background = "radial-gradient(circle at 30% 30%, var(--neon-blue) 0%, var(--neon-purple) 70%, #000 100%)";
            next();
        }

        function next() {
            var currentMatches = filterCharacters();
            
            if (currentMatches.length === 1) {
                showGuess(currentMatches[0].name);
                return;
            }

            if (step < questions.length && currentMatches.length > 1) {
                var q = questions[step];
                
                var tagExists = currentMatches.some(function(char) {
                    return char.tags[q.id] !== undefined;
                });

                if (!tagExists) {
                    step++;
                    next();
                    return;
                }

                document.getElementById('bubble').innerText = q.text;
                document.getElementById('buttons-area').innerHTML = `
                    <div class="answers-grid">
                        <button class="btn-choice" onclick="ans('${q.id}', 'да')">Да, 100%</button>
                        <button class="btn-choice" onclick="ans('${q.id}', 'нет')">Точно нет</button>
                        <button class="btn-choice" onclick="ans('${q.id}', 'хз')">Не знаю / ХЗ</button>
                    </div>
                `;
            } else {
                predict();
            }
        }

        function ans(id, value) {
            log[id] = value;
            step++;
            next();
        }

        function filterCharacters() {
            return db.filter(function(char) {
                for (var key in log) {
                    if (log[key] !== "хз" && char.tags[key] && char.tags[key] !== log[key]) {
                        return false;
                    }
                }
                return true;
            });
        }

        function predict() {
            var filtered = filterCharacters();
            if (filtered.length > 0) {
                // ИСПРАВЛЕНО НАМЕРТВО: забираем имя первого подходящего объекта из массива элементов
                showGuess(filtered[0].name);
            } else {
                fail();
            }
        }

        function showGuess(characterName) {
            document.getElementById('sphere').style.boxShadow = "0 0 30px var(--neon-pink), 0 0 50px var(--neon-purple)";
            document.getElementById('bubble').innerText = "Я уверен, что твои мысли заняты этим бро...\n\n✨ " + characterName + " ✨";
            document.getElementById('buttons-area').innerHTML = `
                <div class="answers-grid">
                    <button class="btn-choice" style="border-color:var(--neon-blue);" onclick="win()">УГАДАЛ, ТЫ ЧИТЕР! 👍</button>
                    <button class="btn-choice" onclick="fail()">МИМО, НЕ ОН 👎</button>
                </div>
            `;
        }

        function win() {
            var total = parseInt(localStorage.getItem('fl_total_matches')) || 4329;
            localStorage.setItem('fl_total_matches', total + 1);
            document.getElementById('bubble').innerText = "Изи катка! Джинн Fluent Game уделал тебя! Сыграем ещё раз?";
            document.getElementById('buttons-area').innerHTML = `<button class="btn-action" onclick="window.location.href='./index.html'">В меню</button>`;
        }

        function fail() {
document.getElementById('bubble').innerText = "ЧЗХ... Ты меня победил. Напиши имя этого сигмы, я внесу его в свою базу:";
document.getElementById('buttons-area').innerHTML = <input type="text" id="new-name" class="input-fail" placeholder="Имя блогера/перса..."> <button class="btn-action" onclick="save()">Запомнить</button>;
}
function save() {
var txt = document.getElementById('new-name').value.trim();
if (txt) {
var newTags = {};
for (var k in log) { if (log[k] !== "хз") newTags[k] = log[k]; }
db.push({ name: txt, tags: newTags });
document.getElementById('bubble').innerText = "Данные записаны! Персонаж '" + txt + "' теперь вшит в мой кибер-мозг!";
document.getElementById('buttons-area').innerHTML = <button class="btn-action" onclick="window.location.href='./index.html'">В меню</button>;
}
}
