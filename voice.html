<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Fluent Arena - Voice Chat</title>
    <style>
        body { background: #02040a; color: #fff; font-family: sans-serif; display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 20px; }
        .box { background: rgba(14,22,47,0.85); border: 1px solid #ff007f; border-radius: 24px; padding: 35px; max-width: 400px; width: 100%; text-align: center; box-shadow: 0 0 25px rgba(255, 0, 127, 0.2); }
        .mic-icon { font-size: 3.5rem; color: #ff007f; margin-bottom: 20px; animation: pulseMic 1.5s infinite alternate; }
        @keyframes pulseMic { from { transform: scale(1); filter: brightness(1); } to { transform: scale(1.05); filter: brightness(1.3); } }
        .btn-menu { display: block; background: #fff; color: #000; padding: 14px; border-radius: 12px; font-weight: bold; text-decoration: none; text-transform: uppercase; margin-top: 30px; }
        .status { color: #00f2fe; font-weight: bold; margin-bottom: 15px; }
    </style>
</head>
<body>
    <div class="box">
        <div class="mic-icon">🎙️</div>
        <h2 style="margin-bottom: 10px; text-transform: uppercase;">Голосовой чат</h2>
        <div class="status">Вставьте код вашего Voice-плагина ниже</div>
        
        <div style="background: rgba(0,0,0,0.4); padding: 15px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.05); font-size: 0.85rem; color: #8fa0b5; text-align: left;">
            <p><strong>Инструкция для разработчика:</strong></p>
            <p style="margin-top: 4px;">Сюда можно подключить WebRTC, Agora.io или Cordova Voice плагин для связи по ID.</p>
        </div>

        <a href="index.html" class="btn-menu">В главное меню</a>
    </div>
</body>
</html>
