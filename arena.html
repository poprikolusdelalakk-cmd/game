<!DOCTYPE html>
<html lang="ru" translate="no" class="notranslate">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fluent Arena - Дуэль</title>
    <style>
        :root { --bg: #02040a; --card: rgba(14, 22, 47, 0.85); --blue: #00f2fe; --pink: #ff007f; --success: #00ff66; --danger: #ff3333; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
        body { background: radial-gradient(circle at center, #0c112b 0%, var(--bg) 100%); color: #fff; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; overflow: hidden; }
        .container { max-width: 460px; width: 100%; display: flex; flex-direction: column; gap: 15px; position: relative; }
        .card { background: var(--card); border: 1px solid rgba(0,242,254,0.2); border-radius: 20px; padding: 20px; text-align: center; position: relative; }
        
        .countdown-screen { position: absolute; top:0; left:0; width:100%; height:100%; background: var(--bg); border-radius: 20px; display: flex; align-items: center; justify-content: center; z-index: 999; font-size: 5rem; font-weight: 900; color: var(--blue); text-shadow: 0 0 25px var(--blue); }
        .battlefield { display: flex; flex-direction: column; gap: 12px; }
        .fighter { background: rgba(0,0,0,0.5); border: 1px solid rgba(255,255,255,0.06); border-radius: 16px; padding: 15px; text-align: left; }
        .hp-bg { width: 100%; height: 16px; background: #111; border-radius: 8px; overflow: hidden; margin-top: 8px; }
        .hp-fill { height: 100%; background: linear-gradient(90deg, #00ff66, #11ff88); width: 100%; transition: width 0.15s ease; }
        .hp-txt { font-size: 0.8rem; text-align: right; margin-top: 4px; color: #8fa0b5; font-weight: bold; }
        .btn-hit { width: 100%; background: var(--blue); color: #000; border: none; padding: 18px; border-radius: 14px; font-size: 1.2rem; font-weight: 900; cursor: pointer; text-transform: uppercase; margin-top: 15px; }
        .btn-hit:disabled { background: #151926 !important; color: #5c6c8f !important; cursor: not-allowed; }
        .log { background: rgba(0,0,0,0.7); border-radius: 14px; padding: 12px; height: 110px; overflow-y: auto; font-size: 0.85rem; color: #ffb703; text-align: left; margin-top: 12px; }
    </style>
</head>
<body>
    <div class="container">
        <div class="card">
            <!-- ОТСЧЕТ 3... 2... 1 -->
            <div class="countdown-screen" id="cd-overlay">3</div>
            <div style="color:var(--blue); font-weight:900; text-transform:uppercase; margin-bottom:12px;">⚡ РЕАЛЬНАЯ PvP АРЕНА ОНЛАЙН ⚡</div>
            
            <div class="battlefield">
                <div class="fighter" style="border-left: 5px solid var(--blue);">
                    <div style="font-weight:bold; display:flex; justify-content:space-between;"><span id="p1-name">Nazar</span> <span id="p1-weap" style="color:#ffb703; font-size:0.85rem;">Кулаки</span></div>
                    <div class="hp-bg"><div class="hp-fill" id="p1-bar"></div></div>
                    <div class="hp-txt"><span id="p1-txt">80/80 HP</span></div>
                </div>
                <div class="fighter" style="border-left: 5px solid var(--pink);">
                    <div style="font-weight:bold; display:flex; justify-content:space-between;"><span id="p2-name">Друг</span> <span style="color:var(--pink); font-size:0.8rem;">ONLINE</span></div>
                    <div class="hp-bg"><div class="hp-fill" id="p2-bar" style="background: linear-gradient(90deg, var(--pink), var(--danger));"></div></div>
                    <div class="hp-txt"><span id="p2-txt">80/80 HP</span></div>
                </div>
            </div>

            <div id="btn-zone" style="display:none;">
                <button class="btn-hit" id="action-btn" onclick="triggerStrike()">⚔️ НАНЕСТИ УДАР (ТВОЙ ХОД)</button>
            </div>
            <div class="log" id="arena-log">Подключение к арене...</div>
        </div>
    </div>

    <script translate="no">
        var p1Name = localStorage.getItem('fl_user_nick') || "Nazar";
        var p2Name = localStorage.getItem('enemy_player_name') || "Друг";

        var p1Hp = 80, p1Max = 80, p1Dmg = 9;
        var p2Hp = 80, p2Max = 80, p2Dmg = 9;

        var bonus = parseInt(localStorage.getItem('fl_bonus_dmg')) || 0;
        var activeW = localStorage.getItem('fl_active_weapon_name') || "Кулаки";

        document.getElementById('p1-name').innerText = p1Name;
        document.getElementById('p2-name').innerText = p2Name;
        document.getElementById('p1-weap').innerText = activeW;

        function refresh() {
            document.getElementById('p1-txt').innerText = p1Hp + "/" + p1Max + " HP";
            document.getElementById('p1-bar').style.width = (p1Hp / p1Max * 100) + "%";
            document.getElementById('p2-txt').innerText = p2Hp + "/" + p2Max + " HP";
            document.getElementById('p2-bar').style.width = (p2Hp / p2Max * 100) + "%";
        }

        // БРОНЕБОЙНЫЙ ИСПРАВЛЕННЫЙ ТАЙМЕР ОТСЧЕТА
        var num = 3;
        var arenaTimer = setInterval(function() {
            num--;
            if(num === 2) document.getElementById('cd-overlay').innerText = "2";
            if(num === 1) document.getElementById('cd-overlay').innerText = "1";
            if(num === 0) {
                document.getElementById('cd-overlay').innerText = "БОЙ! 🔥";
                document.getElementById('cd-overlay').style.color = "var(--success)";
            }
            if(num < 0) {
                clearInterval(arenaTimer);
                document.getElementById('cd-overlay').style.display = "none";
                document.getElementById('btn-zone').style.display = "block";
                log("⚔️ Раунд начался! Твой ход, " + p1Name + "!");
                startLiveMusic();
            }
        }, 850);

        function triggerStrike() {
            if(p1Hp <= 0 || p2Hp <= 0) return;
            var dmg = p1Dmg + bonus + Math.floor(Math.random() * 3);
            p2Hp = Math.max(0, p2Hp - dmg);
            log("⚔️ Ты провёл удар по другу " + p2Name + " на -" + dmg + " HP!");
            refresh();

            if(p2Hp <= 0) {
                log("🏆 ПОБЕДА! Катка выиграна!");
                localStorage.setItem('battle_res', 'win');
                stopBattle();
                return;
            }

            var b = document.getElementById('action-btn');
            b.setAttribute('disabled', 'true');
            b.innerText = "⏳ ОЖИДАНИЕ ХОДА СОПЕРНИКА...";

            setTimeout(function() {
                if(p2Hp <= 0) return;
                var ed = p2Dmg + Math.floor(Math.random() * 3);
                p1Hp = Math.max(0, p1Hp - ed);
                log("💥 Игрок [" + p2Name + "] нанёс ответный удар на -" + ed + " HP!");
                refresh();

                if(p1Hp <= 0) {
                    log("💀 Ты проиграл дуэль!");
                    localStorage.setItem('battle_res', 'fail');
                    stopBattle();
                } else {
                    b.removeAttribute('disabled');
                    b.innerText = "⚔️ НАНЕСТИ УДАР (ТВОЙ ХОД)";
                }
            }, 900);
        }

        function stopBattle() {
            if(window.gameMusicInterval) clearInterval(window.gameMusicInterval);
            document.getElementById('btn-zone').innerHTML = `<button class="btn-hit" style="background:linear-gradient(135deg, var(--pink), #9d4edd); color:#fff;" onclick="window.location.href='result.html'">Завершить 🚩</button>`;
        }

        function log(t) {
            var box = document.getElementById('arena-log');
            box.innerHTML += "<br>" + t;
            box.scrollTop = box.scrollHeight;
        }

        function startLiveMusic() {
            if(localStorage.getItem('fl_music_enabled') !== 'true') return;
            window.gameAudioCtx = new (window.AudioContext || window.webkitAudioContext)();
            var melody = [110.00, 110.00, 130.81, 146.83, 98.00, 98.00, 110.00, 164.81];
            var step = 0;
            window.gameMusicInterval = setInterval(function() {
                var osc = window.gameAudioCtx.createOscillator(); var gain = window.gameAudioCtx.createGain();
                osc.type = 'sawtooth'; osc.frequency.setValueAtTime(melody[step], window.gameAudioCtx.currentTime);
                gain.gain.setValueAtTime(0.05, window.gameAudioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, window.gameAudioCtx.currentTime + 0.3);
                osc.connect(gain); gain.connect(window.gameAudioCtx.destination);
                osc.start(); osc.stop(window.gameAudioCtx.currentTime + 0.35);
                step = (step + 1) % melody.length;
            }, 280);
        }
        refresh();
    </script>
</body>
</html>
