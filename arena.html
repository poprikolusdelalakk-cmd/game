<!DOCTYPE html>
<html lang="ru" translate="no" class="notranslate">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fluent Arena - Сражение</title>
    <style>
        :root { --bg: #030511; --card: rgba(13, 18, 38, 0.85); --blue: #00f2fe; --purple: #9d4edd; --pink: #ff007f; --success: #00ff66; --danger: #ff3333; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
        body { background: radial-gradient(circle at center, #0c112b 0%, var(--bg) 100%); color: #fff; min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 20px; }
        .container { max-width: 480px; width: 100%; display: flex; flex-direction: column; gap: 15px; margin-top: auto; margin-bottom: auto; }
        .card { background: var(--card); border: 1px solid rgba(0, 242, 254, 0.2); border-radius: 20px; padding: 20px; text-align: center; }
        .fighter { background: rgba(0,0,0,0.4); border: 1px solid rgba(255,255,255,0.05); border-radius: 14px; padding: 15px; text-align: left; }
        .name { font-weight: bold; font-size: 1.05rem; margin-bottom: 8px; display: flex; justify-content: space-between; }
        .hp-bg { width: 100%; height: 12px; background: #222; border-radius: 6px; overflow: hidden; }
        .hp-fill { height: 100%; background: var(--success); width: 100%; transition: width 0.2s; }
        .hp-txt { font-size: 0.75rem; text-align: right; margin-top: 4px; color: #7f91a4; }
        .actions { display: grid; grid-template-columns: 1fr; gap: 10px; margin-top: 5px; }
        .btn { background: var(--blue); color: #000; border: none; padding: 14px; border-radius: 12px; font-size: 1rem; font-weight: bold; cursor: pointer; text-transform: uppercase; }
        .btn:hover { background: #fff; }
        .log { background: rgba(0,0,0,0.6); border-radius: 12px; padding: 12px; height: 90px; overflow-y: auto; font-size: 0.85rem; color: #ffb703; text-align: left; border: 1px solid rgba(255,255,255,0.02); }
    </style>
</head>
<body>
    <div class="container">
        <div class="card" style="padding: 10px; font-weight: bold; color: var(--blue); text-transform: uppercase;">КИБЕР АРЕНА БОЯ</div>

        <!-- ИГРОК -->
        <div class="fighter" style="border-left: 4px solid var(--blue);">
            <div class="name"><span id="p-display-name">Боец</span> <span id="p-weapon" style="font-size:0.75rem; color:#ffb703;">Кулаки</span></div>
            <div class="hp-bg"><div class="hp-fill" id="p-bar"></div></div>
            <div class="hp-txt"><span id="p-text">100/100</span> HP</div>
        </div>

        <!-- РАНДОМНЫЙ БОТ -->
        <div class="fighter" style="border-left: 4px solid var(--pink);">
            <div class="name"><span id="e-display-name">Загрузка бота...</span> <span style="font-size:0.75rem; color:var(--danger);">BOT</span></div>
            <div class="hp-bg"><div class="hp-fill" id="e-bar" style="background:var(--danger);"></div></div>
            <div class="hp-txt"><span id="e-text">100/100</span> HP</div>
        </div>

        <!-- КНОПКИ АТАК -->
        <div class="actions" id="act-zone">
            <button class="btn" onclick="attack()">⚔️ Нанести удар</button>
        </div>

        <div class="log" id="arena-log">⚔️ Раунд начался! Бей первым!</div>
    </div>

    <script>
        var pName = localStorage.getItem('p_name') || "Сигма";
        var pHp = parseInt(localStorage.getItem('p_hp')) || 100;
        var pMax = parseInt(localStorage.getItem('p_max_hp')) || 100;
        var pDmg = parseInt(localStorage.getItem('p_dmg')) || 15;
        var pPass = localStorage.getItem('p_pass') || "";
        var bonusDmg = parseInt(localStorage.getItem('fl_bonus_dmg')) || 0;

        // Выбираем рандомного бота-соперника
        var bots = ["Влад А4 Босс", "Скибиди Туалет", "Фредди Фазбер", "Глент Мутант", "Злой Кобяков"];
        var eName = bots[Math.floor(Math.random() * bots.length)];
        var eHp = 80 + Math.floor(Math.random() * 50);
        var eMax = eHp;
        var eDmg = 12 + Math.floor(Math.random() * 8);

        document.getElementById('p-display-name').innerText = pName;
        document.getElementById('e-display-name').innerText = eName;
        if(bonusDmg > 0) document.getElementById('p-weapon').innerText = "Снаряжение +" + bonusDmg + " Атк";

        function refresh() {
            document.getElementById('p-text').innerText = pHp + "/" + pMax;
            document.getElementById('p-bar').style.width = (pHp / pMax * 100) + "%";
            document.getElementById('e-text').innerText = eHp + "/" + eMax;
            document.getElementById('e-bar').style.width = (eHp / eMax * 100) + "%";
        }

        function attack() {
            if (pHp <= 0 || eHp <= 0) return;
            
            // Твой удар
            var finalDmg = pDmg + bonusDmg;
            if (pName === "Nazar" && Math.random() < 0.25) {
                finalDmg = Math.floor(finalDmg * 1.8);
                log("⚡ КРИТ ОТ НАЗАРА! Нанесено " + finalDmg + " урона!");
            } else {
                log("⚔️ Ты врезал боту " + eName + " на -" + finalDmg + " HP!");
            }
            
            eHp = Math.max(0, eHp - finalDmg);
            refresh();

            if (eHp <= 0) {
                log("🏆 ТЫ ПОБЕДИЛ! Бот пал смертью храбрых.");
                localStorage.setItem('battle_res', 'win');
                endGame();
                return;
            }

            // Удар бота
            document.getElementById('act-zone').innerHTML = `<button class="btn" style="background:#444; color:#aaa; cursor:not-allowed;">Защита...</button>`;
            setTimeout(function() {
                if(eHp <= 0) return;
                var ed = eDmg;
                if(pName === "Mellstroy" && Math.random() < 0.25) {
                    ed = Math.floor(ed * 0.3);
                    log("💎 Пассивка Меллстроя: Щит заблокал 70% урона!");
                }
                pHp = Math.max(0, pHp - ed);
                log("💥 " + eName + " ударил в ответ на -" + ed + " HP!");
                refresh();

                if (pHp <= 0) {
                    log("💀 ТЫ ПРОИГРАЛ! Боец повержен.");
                    localStorage.setItem('battle_res', 'fail');
                    endGame();
                } else {
                    document.getElementById('act-zone').innerHTML = `<button class="btn" onclick="attack()">⚔️ Нанести удар</button>`;
                }
            }, 600);
        }

        function endGame() {
            document.getElementById('act-zone').innerHTML = `<button class="btn" style="background:var(--pink); color:#fff;" onclick="window.location.href='result.html'">Завершить бой 🚩</button>`;
        }

        function log(t) {
            var l = document.getElementById('arena-log');
            l.innerHTML += "<br>" + t;
            l.scrollTop = l.scrollHeight;
        }
        refresh();
    </script>
</body>
</html>
