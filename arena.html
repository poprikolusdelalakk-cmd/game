<!DOCTYPE html>
<html lang="ru" translate="no" class="notranslate">
<head>
    <meta charset="UTF-8">
    <title>Fluent Arena - Бой</title>
    <style>
        :root { --blue: #00f2fe; --pink: #ff007f; --success: #00ff66; --danger: #ff3333; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
        body { background: #02040a; color: #fff; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
        .container { max-width: 460px; width: 100%; display: flex; flex-direction: column; gap: 15px; }
        .card { background: rgba(14,22,47,0.85); border: 1px solid rgba(0,242,254,0.2); border-radius: 20px; padding: 20px; text-align: center; }
        .fighter { background: rgba(0,0,0,0.4); border: 1px solid rgba(255,255,255,0.06); border-radius: 14px; padding: 15px; }
        .hp-bg { width: 100%; height: 12px; background: #222; border-radius: 6px; overflow: hidden; margin-top: 8px; }
        .hp-fill { height: 100%; background: var(--success); width: 100%; transition: width 0.2s; }
        .btn { width: 100%; background: var(--blue); color: #000; border: none; padding: 15px; border-radius: 12px; font-size: 1.1rem; font-weight: bold; cursor: pointer; text-transform: uppercase; margin-top: 10px; }
        .log { background: rgba(0,0,0,0.7); border-radius: 12px; padding: 12px; height: 100px; overflow-y: auto; font-size: 0.85rem; color: #ffb703; text-align: left; }
    </style>
</head>
<body>
    <div class="container">
        <div class="card" style="color:var(--blue); font-weight:900; letter-spacing:1px;">⚔️ ХАРДКОР PvP АРЕНА (СИГМА VS СИГМА) ⚔️</div>

        <!-- ИГРОК -->
        <div class="fighter" style="border-left: 4px solid var(--blue);">
            <div style="font-weight:bold; display:flex; justify-content:space-between;"><span id="p-name">Загрузка...</span> <span id="p-weap" style="color:#ffb703; font-size:0.8rem;">Кулаки</span></div>
            <div class="hp-bg"><div class="hp-fill" id="p-bar"></div></div>
            <div style="text-align:right; font-size:0.75rem; color:#8fa0b5; margin-top:4px;" id="p-txt">100/100 HP</div>
        </div>

        <!-- БОТ-СИГМА -->
        <div class="fighter" style="border-left: 4px solid var(--pink);">
            <div style="font-weight:bold; display:flex; justify-content:space-between;"><span id="e-name">Поиск Сигмы...</span> <span id="e-weap" style="color:#ffb703; font-size:0.8rem;">Оружие ИИ</span></div>
            <div class="hp-bg"><div class="hp-fill" id="e-bar" style="background:var(--danger)"></div></div>
            <div style="text-align:right; font-size:0.75rem; color:#8fa0b5; margin-top:4px;" id="e-txt">100/100 HP</div>
        </div>

        <div class="actions" id="act-zone">
            <button class="btn" onclick="attack()">⚔️ Нанести тактический удар</button>
        </div>

        <div class="log" id="arena-log">🔥 Вражеский Сигма готов к бою. Сражайся жестко!</div>
    </div>

    <script>
        var pName = localStorage.getItem('p_name') || "Nazar";
        var pHp = parseInt(localStorage.getItem('p_hp')) || 120;
        var pMax = parseInt(localStorage.getItem('p_max_hp')) || 120;
        var pDmg = parseInt(localStorage.getItem('p_dmg')) || 18;
        var bonusDmg = parseInt(localStorage.getItem('fl_bonus_dmg')) || 0;
        var wName = localStorage.getItem('fl_active_weapon_name') || "Кулаки";

        // Сигма-Бот с равными или превосходящими силами!
        var sigmas = ["Сигма Мурад", "Сигма Макс", "Кибер Сигма 228", "Сигма Грифер Киллер"];
        var eName = sigmas[Math.floor(Math.random() * sigmas.length)];
        var eHp = pMax + Math.floor(Math.random() * 25); // ХП бота зависит от твоего, чтобы было сложно
        var eMax = eHp;
        var eDmg = pDmg + Math.floor(Math.random() * 5);
        var eBonus = Math.floor(Math.random() * 15);

        document.getElementById('p-name').innerText = pName;
        document.getElementById('e-name').innerText = eName;
        document.getElementById('p-weap').innerText = wName;
        document.getElementById('e-weap').innerText = "🔥 Снаряжение +" + eBonus + " Атк";

        function refresh() {
            document.getElementById('p-txt').innerText = pHp + "/" + pMax + " HP";
            document.getElementById('p-bar').style.width = (pHp / pMax * 100) + "%";
            document.getElementById('e-txt').innerText = eHp + "/" + eMax + " HP";
            document.getElementById('e-bar').style.width = (eHp / eMax * 100) + "%";
        }

        function attack() {
            if (pHp <= 0 || eHp <= 0) return;

            // Твой ход
            var fd = pDmg + bonusDmg;
            if (pName === "Nazar" && Math.random() < 0.3) {
                fd = Math.floor(fd * 2);
                log("⚡ КРИТИЧЕСКИЙ СУПЕР-УДАР НАЗАРА: Нанесено -" + fd + " HP врагу!");
            } else {
                log("⚔️ Ты атаковал Сигму " + eName + " на -" + fd + " HP!");
            }
            eHp = Math.max(0, eHp - fd);
            refresh();

            if (eHp <= 0) {
                log("🏆 КРАСАВЧИК! Ты разнёс Сигму-соперника!");
                localStorage.setItem('battle_res', 'win');
                end();
                return;
            }

            // Ход Сложного Сигма-Бота
            document.getElementById('act-zone').innerHTML = `<button class="btn" style="background:#222; color:#555; cursor:not-allowed;">Враг контратакует...</button>`;
            setTimeout(function() {
                if(eHp <= 0) return;
                var ed = eDmg + eBonus;
                if(Math.random() < 0.25) { // Бот тоже может наносить КРИТЫ!
                    ed = Math.floor(ed * 1.8);
                    log("💥 КРИТ ОТ ВРАЖЕСКОГО СИГМЫ! Снято -" + ed + " HP!");
                } else {
                    log("💥 Сигма " + eName + " врубил комбо и снёс тебе -" + ed + " HP!");
                }
                
                pHp = Math.max(0, pHp - ed);
                refresh();

                if (pHp <= 0) {
                    log("💀 ТЕБЯ УДЕЛАЛИ! Этот Сигма оказался сильнее.");
                    localStorage.setItem('battle_res', 'fail');
                    end();
                } else {
                    document.getElementById('act-zone').innerHTML = `<button class="btn" onclick="attack()">⚔️ Нанести тактический удар</button>`;
                }
            }, 600);
        }

        function end() {
            document.getElementById('act-zone').innerHTML = `<button class="btn" style="background:var(--pink); color:#fff;" onclick="window.location.href='result.html'">Завершить бой 🚩</button>`;
        }

        function log(t) {
            var box = document.getElementById('arena-log');
            box.innerHTML += "<br>" + t;
            box.scrollTop = box.scrollHeight;
        }
        refresh();
    </script>
</body>
</html>
