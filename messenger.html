<!DOCTYPE html>
<html lang="ru" translate="no" class="notranslate">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="google" content="notranslate">
    <title>Fluent Messenger - Чат</title>
    <link rel="manifest" href="manifest.json">
    <style>
        :root {
            --bg-dark: #0e1621;
            --side-bg: #17212b;
            --chat-bg: #0e1621;
            --accent: #2481cc;
            --accent-hover: #2f93de;
            --text-color: #f5f5f5;
            --text-muted: #7f91a4;
            --msg-in: #182533;
            --msg-out: #2b5278;
            --border-color: #101921;
            --danger: #e53935;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
        body, html { background-color: var(--bg-dark); color: var(--text-color); width: 100%; height: 100%; overflow: hidden; }
        .wrapper { width: 100vw; height: 100vh; display: flex; }
        
        .sidebar { width: 320px; height: 100%; background-color: var(--side-bg); border-right: 1px solid var(--border-color); display: flex; flex-direction: column; flex-shrink: 0; }
        .sidebar-header { padding: 15px 20px; border-bottom: 1px solid var(--border-color); display: flex; justify-content: space-between; align-items: center; }
        
        /* КРАСИВОЕ НАЗВАНИЕ МЕССЕНДЖЕРА ВЗАМЕН НИКА */
        .sidebar-header h2 { color: var(--accent); font-size: 1.4rem; font-weight: 900; text-transform: uppercase; letter-spacing: 1.5px; text-shadow: 0 0 10px rgba(36, 129, 204, 0.4); }
        
        .header-actions { display: flex; gap: 10px; align-items: center; }
        .settings-link-btn { color: var(--text-muted); cursor: pointer; font-size: 0.85rem; font-weight: bold; text-decoration: underline; }
        .settings-link-btn:hover { color: var(--accent); }
        .logout-btn { color: var(--danger); cursor: pointer; font-size: 0.85rem; font-weight: bold; text-decoration: underline; }
        
        .add-friend-box { padding: 15px 20px; border-bottom: 1px solid var(--border-color); display: flex; gap: 8px; }
        .add-friend-box input { flex: 1; background-color: var(--bg-dark); border: 1px solid var(--border-color); padding: 10px; border-radius: 8px; color: #fff; outline: none; font-size: 0.9rem; }
        .add-friend-box button { background-color: var(--accent); border: none; color: #fff; padding: 0 15px; border-radius: 8px; cursor: pointer; font-weight: bold; font-size: 1.1rem; }

        .chats-list { flex: 1; overflow-y: auto; }
        .chat-item { display: flex; align-items: center; padding: 14px 20px; cursor: pointer; border-bottom: 1px solid rgba(0,0,0,0.15); transition: background 0.2s; }
        .chat-item:hover { background-color: rgba(255,255,255,0.02); }
        .chat-item.selected { background-color: var(--accent); }
        .chat-avatar { width: 40px; height: 40px; background-color: #5288c1; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: bold; margin-right: 12px; color: #fff; flex-shrink: 0; }
        .chat-item.selected .chat-avatar { background-color: #fff; color: #2481cc; }
        .chat-info { display: flex; flex-direction: column; gap: 2px; flex: 1; overflow: hidden; }
        .chat-name { font-weight: bold; font-size: 1rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

        .main-chat { flex: 1; height: 100%; background-color: var(--chat-bg); display: flex; flex-direction: column; overflow: hidden; }
        .no-chat { flex: 1; display: flex; align-items: center; justify-content: center; color: var(--text-muted); font-size: 1rem; }
        .chat-area { display: none; flex-direction: column; width: 100%; height: 100%; overflow: hidden; }
        
        .chat-header { padding: 15px 24px; background-color: var(--side-bg); border-bottom: 1px solid var(--border-color); display: flex; justify-content: space-between; align-items: center; flex-shrink: 0; }
        .chat-title-text { font-weight: bold; font-size: 1.1rem; color: var(--accent); }

        .messages-box { flex: 1; padding: 24px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; width: 100%; }
        .bubble { max-width: 65%; padding: 11px 16px; border-radius: 14px; font-size: 0.98rem; line-height: 1.4; word-break: break-word; color: #fff; display: block; width: fit-content; clear: both; }
        .bubble.incoming { align-self: flex-start; background-color: var(--msg-in); border: 1px solid rgba(255,255,255,0.02); }
        .bubble.outgoing { align-self: flex-end; background-color: var(--msg-out); box-shadow: 0 2px 8px rgba(0,0,0,0.2); }

        .input-box { padding: 16px 24px; background-color: var(--side-bg); border-top: 1px solid var(--border-color); display: flex; gap: 12px; align-items: center; flex-shrink: 0; }
        .input-box input { flex: 1; background-color: var(--bg-dark); border: 1px solid var(--border-color); padding: 14px 18px; border-radius: 10px; color: #fff; outline: none; font-size: 1rem; }
        .btn-send-click { background-color: var(--accent); border: none; color: #fff; padding: 14px 24px; border-radius: 10px; font-weight: bold; cursor: pointer; text-transform: uppercase; }

        .settings-overlay { display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(14,22,33,0.85); z-index: 999; align-items: center; justify-content: center; backdrop-filter: blur(8px); }
        .settings-modal { background-color: var(--side-bg); padding: 35px; border-radius: 20px; border: 1px solid rgba(255,255,255,0.05); width: 100%; max-width: 360px; box-shadow: 0 15px 40px rgba(0,0,0,0.6); text-align: center; }
        .settings-modal h3 { font-size: 1.5rem; margin-bottom: 20px; color: var(--accent); }
        .info-card { background-color: var(--bg-dark); padding: 14px; border-radius: 12px; text-align: left; margin-bottom: 20px; border: 1px solid var(--border-color); }
        .info-line { display: flex; justify-content: space-between; padding: 6px 0; font-size: 0.95rem; }
        .info-line span:first-child { color: var(--text-muted); }
        .modal-btn { width: 100%; padding: 12px; border: none; border-radius: 10px; font-weight: bold; cursor: pointer; text-transform: uppercase; margin-bottom: 10px; }
        .modal-btn.close { background-color: var(--accent); color: #fff; }
        .modal-btn.reset { background-color: transparent; border: 1px solid var(--danger); color: var(--danger); }
    </style>
</head>
<body>

    <div class="wrapper">
        <!-- БОКОВАЯ ПАНЕЛЬ -->
        <div class="sidebar">
            <div class="sidebar-header">
                <!-- ВЫВЕЛИ НАЗВАНИЕ МЕССЕНДЖЕРА НАПРЯМУЮ -->
                <h2>FLUENT</h2>
                <div class="header-actions">
                    <span class="settings-link-btn" onclick="openSettingsModal()">Настройки</span>
                    <span class="logout-btn" onclick="window.location.href='logout.html'">Выйти</span>
                </div>
            </div>
            <div class="add-friend-box">
                <div class="add-friend-inputs">
                    <input type="text" id="friend-search-input" placeholder="Ник друга...">
                    <button onclick="addContact()">+</button>
                </div>
            </div>
            <div class="chats-list" id="chats-list"></div>
        </div>

        <!-- ОКНО ЧАТА -->
        <div class="main-chat">
            <div class="no-chat" id="no-chat-placeholder">
                <span>Выберите контакт слева для начала общения</span>
            </div>
            <div class="chat-area" id="chat-area">
                <div class="chat-header">
                    <div class="chat-title-text" id="chat-title">Чат</div>
                </div>
                <div class="messages-box" id="messages-box"></div>
                <div class="input-box">
                    <input type="text" id="message-input" placeholder="Напишите сообщение..." onkeypress="handleEnter(event)">
                    <button class="btn-send-click" onclick="postMessage()">Отправить</button>
                </div>
            </div>
        </div>

        <!-- МОДАЛКА НАСТРОЕК -->
        <div class="settings-overlay" id="settings-overlay">
            <div class="settings-modal">
                <h3>Твой Профиль</h3>
                <div class="info-card">
                    <div class="info-line"><span>Никнейм:</span><span id="set-username" style="font-weight: bold;">-</span></div>
                    <div class="info-line"><span>Телефон:</span><span id="set-phone" style="font-weight: bold;">-</span></div>
                </div>
                <button class="modal-btn close" onclick="closeSettingsModal()">Закрыть</button>
                <button class="modal-btn reset" onclick="resetDatabase()">Сбросить всё</button>
            </div>
        </div>
    </div>

    <script>
        // Принудительно очищаем старый битый кэш контактов один раз для полной работоспособности
        if (!localStorage.getItem('fl_db_v5_cleared')) {
            localStorage.removeItem('fluent_msg_storage');
            localStorage.setItem('fl_db_v5_cleared', 'true');
        }

        let myName = localStorage.getItem('fluent_session') || "Nazar";
        let currentChatUser = null;

        // БРОНЕБОЙНЫЙ СПИСОК ЧАТОВ ПО УМОЛЧАНИЮ
        let defaultContacts = ["Fluent_Bot", "Support_Bot"];
        localStorage.setItem('fl_phone_by_name_Fluent_Bot', "Официальный Бот");
        localStorage.setItem('fl_phone_by_name_Support_Bot', "Служба техподдержки");

        // Если в истории нет сообщений бота — зашиваем приветствие прямо намертво
        if (!localStorage.getItem('fluent_msg_storage')) {
            let welcomePackets = [
                { from: "Fluent_Bot", to: myName, txt: "Привет! Тебя приветствует Fluent Messenger!" },
{ from: "Fluent_Bot", to: myName, txt: "Наш мессенджер топ по 3 главным причинам:\n\n1. 100% Скорость — отправка сообщений летают за миллисекунды.\n2. Полная анонимность — все данные лежат только на твоем девайсе.\n3. Крутой неоновый дизайн в стиле Telegram Web К!" }
];
localStorage.setItem('fluent_msg_storage', JSON.stringify(welcomePackets));
}
updateContactsList();
setInterval(updateMessagesBox, 1000);
function openSettingsModal() {
document.getElementById('set-username').innerText = myName;
let phone = localStorage.getItem('fl_phone_by_name_' + myName) || "+7 (999) 777-77-77";
document.getElementById('set-phone').innerText = phone;
document.getElementById('settings-overlay').style.display = 'flex';
}
function closeSettingsModal() {
document.getElementById('settings-overlay').style.display = 'none';
}
function resetDatabase() {
if(confirm("Полностью сбросить историю сообщений и выйти?")) {
localStorage.clear();
window.location.href = 'index.html';
}
}
function updateContactsList() {
const list = document.getElementById('chats-list');
if(!list) return;
// Забираем пользовательские контакты из памяти, если они есть
let userContacts = [];
try {
userContacts = JSON.parse(localStorage.getItem('fl_contacts_' + myName)) || [];
} catch(e) { userContacts = []; }
// Объединяем ботов и контакты пользователя
let finalContacts = [...defaultContacts];
userContacts.forEach(c => {
if(!finalContacts.includes(c)) finalContacts.push(c);
});
let html = "";
finalContacts.forEach(c => {
let isSelected = c === currentChatUser;
html += <div class="chat-item ${isSelected ? 'selected' : ''}" onclick="openChat('${c}')"> <div class="chat-avatar">${c.charAt(0).toUpperCase()}</div> <div class="chat-info"><div class="chat-name">${c}</div></div> </div>;
});
list.innerHTML = html;
}
function addContact() {
const input = document.getElementById('friend-search-input');
const searchValue = input.value.trim();
if (!searchValue || searchValue === myName) return;
let targetName = searchValue;
if (searchValue.startsWith('+') || !isNaN(searchValue)) {
let foundName = localStorage.getItem('fl_name_by_phone_' + searchValue);
if (foundName) targetName = foundName;
}
let userContacts = [];
try {
userContacts = JSON.parse(localStorage.getItem('fl_contacts_' + myName)) || [];
} catch(e) { userContacts = []; }
if (!userContacts.includes(targetName)) {
userContacts.push(targetName);
localStorage.setItem('fl_contacts_' + myName, JSON.stringify(userContacts));
}
openChat(targetName);
input.value = "";
}
function openChat(username) {
currentChatUser = username;
document.getElementById('no-chat-placeholder').style.display = 'none';
document.getElementById('chat-area').style.display = 'flex';
document.getElementById('chat-title').innerText = username;
updateContactsList();
updateMessagesBox();
}
function postMessage() {
const input = document.getElementById('message-input');
const text = input.value.trim();
if (!text || !currentChatUser) return;
let allMsgs = [];
try {
allMsgs = JSON.parse(localStorage.getItem('fluent_msg_storage')) || [];
} catch(e) { allMsgs = []; }
allMsgs.push({ from: myName, to: currentChatUser, txt: text });
localStorage.setItem('fluent_msg_storage', JSON.stringify(allMsgs));
input.value = '';
updateMessagesBox();
}
function updateMessagesBox() {
if (!currentChatUser || document.getElementById('chat-area').style.display !== 'flex') return;
const box = document.getElementById('messages-box');
let allMsgs = [];
try {
allMsgs = JSON.parse(localStorage.getItem('fluent_msg_storage')) || [];
} catch(e) { allMsgs = []; }
let activeMsgs = allMsgs.filter(m => (m.from === myName && m.to === currentChatUser) || (m.from === currentChatUser && m.to === myName));
let html = "";
activeMsgs.forEach(m => {
let isMine = m.from === myName;
html += <div class="bubble ${isMine ? 'outgoing' : 'incoming'}"><div>${escapeHTML(m.txt)}</div></div>;
});
if (box.innerHTML !== html) { box.innerHTML = html; box.scrollTop = box.scrollHeight; }
}
function handleEnter(e) { if (e.key === 'Enter') postMessage(); }
function escapeHTML(str) { return str.replace(/[&<>'"]/g, c => ({ '&': '&', '<': '<', '>': '>', "'": ''', '"': '"' }[c] || c)); }
