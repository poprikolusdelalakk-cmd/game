<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Настройки Профиля и Музыки</title>
    <style>
        body { background: #02040a; color: #fff; font-family: sans-serif; display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 20px; }
        .box { background: rgba(14,22,47,0.85); border: 1px solid rgba(0,242,254,0.2); border-radius: 24px; padding: 30px; max-width: 400px; width: 100%; text-align: center; }
        input { width: 100%; background: #000; border: 1px solid rgba(255,255,255,0.1); padding: 12px; border-radius: 10px; color: #fff; margin-bottom: 15px; outline: none; text-align: center; font-size: 1rem; }
        .music-btn { width: 100%; border: none; padding: 14px; border-radius: 12px; font-weight: bold; cursor: pointer; text-transform: uppercase; margin-bottom: 20px; }
        .music-off { background: #e53935; color: #fff; }
        .music-on { background: #00ff66; color: #000; box-shadow: 0 0 15px #00ff66; }
        .btn-save { width: 100%; background: #00f2fe; color: #000; border: none; padding: 12px; border-radius: 10px; font-weight: bold; cursor: pointer; text-transform: uppercase; margin-bottom: 20px; }
        .btn-menu { display: block; width: 100%; background: #fff; color: #000; padding: 14px; border-radius: 12px; font-weight: bold; text-decoration: none; text-transform: uppercase; text-align: center; }
    </style>
</head>
<body>
    <div class="box">
        <h2 style="margin-bottom:20px; text-transform: uppercase;">⚙️ Настройки Сигмы</h2>
        
        <input type="text" id="nick-input" placeholder="Никнейм...">
        <button class="btn-save" onclick="save()">Сохранить ник</button>

        <button class="music-btn music-off" id="music-trigger" onclick="toggle()">🎵 Саундтрек: ВЫКЛЮЧЕН</button>
        <a href="index.html" class="btn-menu">В меню</a>
    </div>
    <script>
        document.getElementById('nick-input').value = localStorage.getItem('fl_user_nick') || "Nazar";
        var btn = document.getElementById('music-trigger');
        
        if (localStorage.getItem('fl_music_enabled') === 'true') {
            btn.className = "music-btn music-on";
            btn.innerText = "🎵 Саундтрек: ВКЛЮЧЕН 🔥";
        }

        function save() {
            var txt = document.getElementById('nick-input').value.trim();
            if(txt) localStorage.setItem('fl_user_nick', txt);
            alert("Никнейм успешно сохранен!");
        }

        function toggle() {
            if (localStorage.getItem('fl_music_enabled') === 'true') {
                localStorage.setItem('fl_music_enabled', 'false');
                btn.className = "music-btn music-off";
                btn.innerText = "🎵 Саундтрек: ВЫКЛЮЧЕН";
                if(window.musicInterval) clearInterval(window.musicInterval);
            } else {
                localStorage.setItem('fl_music_enabled', 'true');
                btn.className = "music-btn music-on";
                btn.innerText = "🎵 Саундтрек: ВКЛЮЧЕН 🔥";
                playMelody();
            }
        }

        function playMelody() {
            window.audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            var notes = [110.00, 130.81, 146.83, 164.81, 196.00, 220.00, 164.81, 146.83]; 
            var currentNote = 0;

            window.musicInterval = setInterval(function() {
                if(localStorage.getItem('fl_music_enabled') !== 'true') return;
                var osc = window.audioCtx.createOscillator();
                var gain = window.audioCtx.createGain();
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(notes[currentNote], window.audioCtx.currentTime);
                gain.gain.setValueAtTime(0.05, window.audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, window.audioCtx.currentTime + 0.3);
                osc.connect(gain); gain.connect(window.audioCtx.destination);
                osc.start(); osc.stop(window.audioCtx.currentTime + 0.35);
                currentNote = (currentNote + 1) % notes.length;
            }, 300);
        }
    </script>
</body>
</html>
