<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fluent Messenger - Настройки</title>
    <style>
        :root {
            --bg-dark: #0e1621;
            --side-bg: #17212b;
            --accent: #2481cc;
            --text-color: #f5f5f5;
            --text-muted: #7f91a4;
            --danger: #e53935;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
        body { background-color: var(--bg-dark); color: var(--text-color); height: 100vh; display: flex; align-items: center; justify-content: center; }
        .box { background-color: var(--side-bg); padding: 40px; border-radius: 16px; width: 100%; max-width: 360px; text-align: center; border: 1px solid rgba(36, 129, 204, 0.2); }
        h1 { font-size: 1.6rem; color: var(--accent); margin-bottom: 20px; }
        .info { background-color: var(--bg-dark); padding: 15px; border-radius: 10px; margin-bottom: 20px; text-align: left; }
        button { width: 100%; padding: 12px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; text-transform: uppercase; margin-bottom: 10px; }
        .back { background-color: var(--accent); color: #fff; }
        .clear { background-color: transparent; border: 1px solid var(--danger); color: var(--danger); }
    </style>
</head>
<body>
    <div class="box">
        <h1>Настройки Профиля</h1>
        <div class="info">
            <p style="margin-bottom:8px;"><span style="color:var(--text-muted)">Имя пользователя:</span> <strong id="p-name">Nazar</strong></p>
            <p><span>Версия:</span> <strong>Fluent Web 2.0 (Стабильная)</strong></p>
        </div>
        <button class="back" onclick="window.location.href='messenger.html'">Назад к чатам</button>
        <button class="clear" onclick="clearDb()">Сбросить кэш мессенджера</button>
    </div>
    <script>
        document.getElementById('p-name').innerText = localStorage.getItem('fluent_session') || "Nazar";
        function clearDb() {
            if(confirm("Сбросить базу сообщений?")) {
                localStorage.clear();
                window.location.href = 'index.html';
            }
        }
    </script>
</body>
</html>
