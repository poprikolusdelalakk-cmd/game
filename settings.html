<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Настройки Профиля и Музыки</title>
    <style>
        body { background: #02040a; color: #fff; font-family: sans-serif; display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 20px; }
        .box { background: rgba(14,22,47,0.85); border: 1px solid rgba(0,242,254,0.2); border-radius: 24px; padding: 30px; max-width: 400px; width: 100%; text-align: center; }
        input { width: 100%; background: #000; border: 1px solid rgba(255,255,255,0.1); padding: 12px; border-radius: 10px; color: #fff; margin-bottom: 15px; outline: none; text-align: center; font-size: 1rem; }
        input:focus { border-color: #00f2fe; }
        .music-btn { width: 100%; border: none; padding: 14px; border-radius: 12px; font-weight: bold; cursor: pointer; text-transform: uppercase; font-size: 0.9rem; margin-bottom: 15px; transition: 0.2s; }
        .music-off { background: #e53935; color: #fff; }
        .music-on { background: #00ff66; color: #000; box-shadow: 0 0 15px #00ff66; }
        .btn-save { width: 100%; background: #00f2fe; color: #000; border: none; padding: 12px; border-radius: 10px; font-weight: bold; cursor: pointer; text-transform: uppercase; margin-bottom: 15px; }
        .btn-menu { display: block; background: #fff; color: #000; padding: 14px; border-radius: 12px; font-weight: bold; text-decoration: none; text-transform: uppercase; text-align: center; }
    </style>
</head>
<body>
    <div class="box">
        <h2 style="margin-bottom:20px; text-transform: uppercase;">⚙️ Настройки Сигмы</h2>
        
        <div style="text-align:left; font-size:0.85rem; color:#8fa0b5; margin-bottom:6px; font-weight:bold;">ТВОЙ НИКНЕЙМ:</div>
        <input type="text" id="nick-input" placeholder="Введи новый ник...">
        <button class="btn-save" onclick="saveNick()">Сохранить ник</button>

        <div style="text-align:left; font-size:0.85rem; color:#8fa0b5; margin-bottom:8px; font-weight:bold;">КИБЕР-САУНДТРЕК ИГРЫ:</div>
        <button class="music-btn music-off" id="music-trigger" onclick="toggleCyberMusic()">🎵 Саундтрек: ВЫКЛЮЧЕН</button>

        <div style="background:rgba(0,0,0,0.3); padding:12px; border-radius:10px; text-align:left; border:1px solid rgba(255,255,255,0.05); margin-bottom: 20px;">
            <p style="color:#8fa0b5; font-size: 0.75rem;">Твой уникальный аккаунт-код:</p>
            <p style="font-size:1.2rem; font-weight:bold; color:#00f2fe;" id="set-id-val">------</p>
        </div>

        <a href="index.html" class="btn-menu">В главное меню</a>
    </div>

    <script>
        document.getElementById('set-id-val').innerText = localStorage.getItem('fl_user_id') || "123456";
        document.getElementById('nick-input').value = localStorage.getItem('fl_user_nick') || "Nazar";

        function saveNick() {
            var input = document.getElementById('nick-input').value.trim();
            if(!input) { alert("Ник не может быть пустым!"); return; }
            localStorage.setItem('fl_user_nick', input);
            alert("Никнейм успешно изменен на '" + input + "' и теперь виден твоим друзьям!");
        }

        // БРОНЕБОЙНЫЙ ВСТРОЕННЫЙ СИНТЕЗАТОР НЕОНОВОЙ МУЗЫКИ (Web Audio API)
        var audioCtx = null;
        var musicInterval = null;
        var isMusicPlaying = false;

        function toggleCyberMusic() {
            var btn = document.getElementById('music-trigger');
            if (!isMusicPlaying) {
                // Включаем генерацию трека
                isMusicPlaying = true;
                btn.className = "music-btn music-on";
                btn.innerText = "🎵 Саундтрек: ИГРАЕТ 🔥";
                playMelody();
            } else {
                // Выключаем трек
                isMusicPlaying = false;
                btn.className = "music-btn music-off";
                btn.innerText = "🎵 Саундтрек: ВЫКЛЮЧЕН";
                if(musicInterval) clearInterval(musicInterval);
            }
        }

        function playMelody() {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            // Мелодия в стиле киберпанк (частоты нот)
            var notes =; 
            var currentNote = 0;

            musicInterval = setInterval(function() {
                if(!isMusicPlaying) return;
                var osc = audioCtx.createOscillator();
                var gain = audioCtx.createGain();
                
                osc.type = 'sawtooth'; // Кибер-звучание пилы
                osc.frequency.setValueAtTime(notes[currentNote], audioCtx.currentTime);
                
                gain.gain.setValueAtTime(0.08, audioCtx.currentTime); // Делаем тихий фоновый звук
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.4);
                
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.4);
                
                currentNote = (currentNote + 1) % notes.length;
            }, 300);
        }
    </script>
</body>
</html>
