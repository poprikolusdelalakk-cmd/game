<!DOCTYPE html>
<html lang="ru" translate="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fluent Messenger - Настройки</title>
    <style>
        :root {
            --bg-dark: #0e1621;
            --side-bg: #17212b;
            --accent: #2481cc;
            --accent-hover: #2f93de;
            --text-color: #f5f5f5;
            --text-muted: #7f91a4;
            --border-color: #101921;
            --danger: #e53935;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
        body { background-color: var(--bg-dark); color: var(--text-color); height: 100vh; display: flex; align-items: center; justify-content: center; }
        .settings-box { background-color: var(--side-bg); padding: 40px; border-radius: 16px; border: 1px solid rgba(0, 242, 254, 0.1); width: 100%; max-width: 400px; box-shadow: 0 15px 50px rgba(0,0,0,0.6); }
        .settings-box h1 { margin-bottom: 20px; font-size: 2rem; font-weight: bold; text-align: center; color: var(--accent); }
        
        .profile-info { background-color: var(--bg-dark); padding: 15px; border-radius: 10px; margin-bottom: 20px; border: 1px solid var(--border-color); }
        .info-item { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid rgba(255,255,255,0.02); }
        .info-item:last-child { border: none; }
        .label { color: var(--text-muted); font-size: 0.9rem; }
        .val { font-weight: bold; color: #fff; }

        .btn { width: 100%; border: none; padding: 14px; border-radius: 10px; font-size: 1rem; font-weight: bold; cursor: pointer; text-transform: uppercase; margin-bottom: 12px; }
        .btn.back { background-color: var(--accent); color: #fff; }
        .btn.back:hover { background-color: var(--accent-hover); }
        .btn.clear-db { background-color: transparent; border: 1px solid var(--danger); color: var(--danger); }
        .btn.clear-db:hover { background-color: var(--danger); color: #fff; }
    </style>
</head>
<body>

    <div class="settings-box">
        <h1>Настройки Профиля</h1>
        
        <div class="profile-info">
            <div class="info-item">
                <span class="label">Твой Никнейм:</span>
                <span class="val" id="my-username">Загрузка...</span>
            </div>
            <div class="info-item">
                <span class="label">Номер телефона:</span>
                <span class="val" id="my-phone">Не привязан</span>
            </div>
        </div>

        <button class="btn back" onclick="window.location.href='./chat.html'">Назад к чатам</button>
        <button class="btn clear-db" onclick="clearData()">Сбросить базу данных</button>
    </div>

    <script>
        let sessionUser = localStorage.getItem('fluent_session') || null;

        if (!sessionUser) {
            window.location.href = './index.html';
        } else {
            document.getElementById('my-username').innerText = sessionUser;
            let phone = localStorage.getItem(`fl_phone_by_name_${sessionUser}`) || "Не указан";
            document.getElementById('my-phone').innerText = phone;
        }

        function clearData() {
            if (confirm("Вы уверены, что хотите полностью очистить историю сообщений и контакты?")) {
                localStorage.clear();
                alert("База данных успешно сброшена!");
                window.location.href = './index.html';
            }
        }
    </script>
</body>
</html>
