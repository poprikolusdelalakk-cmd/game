<!DOCTYPE html>
<html lang="ru" translate="no" class="notranslate">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fluent Arena - Итоги</title>
    <style>
        :root { --bg: #030511; --card: rgba(13, 18, 38, 0.85); --blue: #00f2fe; --purple: #9d4edd; --success: #00ff66; --danger: #ff3333; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
        body { background: radial-gradient(circle at center, #0c112b 0%, var(--bg) 100%); color: #fff; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
        .card { background: var(--card); border: 1px solid rgba(0, 242, 254, 0.2); border-radius: 24px; padding: 35px 25px; text-align: center; max-width: 440px; width: 100%; box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6); }
        h1 { font-size: 1.8rem; font-weight: 900; color: var(--blue); letter-spacing: 2px; margin-bottom: 20px; text-shadow: 0 0 10px rgba(0,242,254,0.3); }
        .res-text { font-size: 1.4rem; font-weight: bold; margin-bottom: 25px; }
        .shop { border-top: 1px solid rgba(255,255,255,0.08); margin-top: 20px; padding-top: 20px; text-align: left; }
        .shop-title { text-align: center; color: var(--purple); font-weight: bold; margin-bottom: 15px; font-size: 0.95rem; letter-spacing: 1px; }
        .item { display: flex; justify-content: space-between; align-items: center; background: rgba(0,0,0,0.3); border: 1px solid rgba(255,255,255,0.05); padding: 12px; border-radius: 12px; margin-bottom: 10px; }
        .item h4 { font-size: 0.95rem; color: var(--blue); }
        .item p { font-size: 0.75rem; color: #6f7f9f; }
        .btn-buy { background: var(--success); color: #000; border: none; padding: 6px 12px; border-radius: 6px; font-weight: bold; cursor: pointer; }
        .btn-menu { display: block; width: 100%; background: #fff; color: #000; border: none; padding: 14px; border-radius: 12px; font-size: 1rem; font-weight: bold; cursor: pointer; text-transform: uppercase; margin-top: 25px; text-decoration: none; text-align: center; }
    </style>
</head>
<body>
    <div class="card">
        <h1>БОЙ ЗАВЕРШЕН! 🚩</h1>
        <div class="res-text" id="res-display">-</div>
        <div>Твой баланс: <span id="gold-display" style="color:#ffb703; font-weight:bold;">0</span> 💰</div>

        <!-- МАГАЗИН ВНУТРИ СТРАНИЦЫ ИТОГОВ -->
        <div class="shop">
            <div class="shop-title">ДАРКНЕТ-ОРУЖЕЙНАЯ</div>
            <div class="item">
                <div><h4>Лопата Мортиса</h4><p>Добавляет +8 к урону навсегда</p></div>
                <button class="btn-buy" onclick="buy('shovel', 40, 8)">40 💰</button>
            </div>
            <div class="item">
                <div><h4>Админка ReallyWorld</h4><p>Добавляет +25 к урону навсегда</p></div>
                <button class="btn-buy" onclick="buy('admin', 100, 25)">100 💰</button>
            </div>
        </div>

        <a href="index.html" class="btn-menu">Вернуться в меню</a>
    </div>
    <script>
        var res = localStorage.getItem('battle_res');
        var gold = parseInt(localStorage.getItem('fl_game_gold')) || 0;
        var bonusDmg = parseInt(localStorage.getItem('fl_bonus_dmg')) || 0;

        if (res === 'win') {
            document.getElementById('res-display').innerText = "🎉 ПОБЕДА СИГМЫ! 🎉";
            document.getElementById('res-display').style.color = "var(--success)";
            gold += 30; // Награда за победу
        } else {
            document.getElementById('res-display').innerText = "💀 ТЕБЯ РАЗНЕСЛИ СЛИВОМ! 💀";
            document.getElementById('res-display').style.color = "var(--danger)";
            gold += 5; // Награда за луз
        }
        localStorage.setItem('fl_game_gold', gold);
        document.getElementById('gold-display').innerText = gold;

        function buy(id, cost, dmg) {
            if (gold < cost) { alert("Недостаточно золота!"); return; }
            gold -= cost;
            bonusDmg += dmg;
            localStorage.setItem('fl_game_gold', gold);
            localStorage.setItem('fl_bonus_dmg', bonusDmg);
            document.getElementById('gold-display').innerText = gold;
            alert("Оружие успешно куплено и вкачано в твои кулаки!");
        }
    </script>
</body>
</html>
