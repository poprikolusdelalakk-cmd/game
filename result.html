<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Итоги Боя</title>
    <style>
        body { background: #02040a; color: #fff; font-family: sans-serif; text-align: center; padding: 30px 20px; }
        .box { background: rgba(14,22,47,0.85); border: 1px solid rgba(0,242,254,0.2); border-radius: 20px; padding: 30px; max-width: 420px; margin: 0 auto; }
        .btn-menu { display: block; background: #fff; color: #000; padding: 14px; border-radius: 12px; font-weight: bold; text-decoration: none; text-transform: uppercase; margin-top: 20px; }
        .item { display: flex; justify-content: space-between; background: rgba(0,0,0,0.3); padding: 10px; border-radius: 10px; margin-top: 10px; border: 1px solid rgba(255,255,255,0.05); }
    </style>
</head>
<body>
    <div class="box">
        <h2 id="res-display">Завершено</h2>
        <div style="margin: 15px 0;">Баланс: <span id="gold-display" style="color:#ffb703; font-weight:bold;">0</span> 💰</div>

        <div style="border-top:1px solid #333; margin-top:20px; padding-top:15px; text-align:left;">
            <h3 style="text-align:center; color:#9d4edd; font-size:1rem; margin-bottom:10px;">ДАРКНЕТ-ОРУЖЕЙНАЯ</h3>
            <div class="item"><h4>🗡️ Меч Грифера (+15 Атк)</h4><button onclick="buy('Меч Грифера 🗡️', 50, 15)">50 💰</button></div>
            <div class="item"><h4>👑 Админка RW (+30 Атк)</h4><button onclick="buy('Админка RW 👑', 100, 30)">100 💰</button></div>
        </div>
        <a href="index.html" class="btn-menu">В меню</a>
    </div>
    <script>
        var res = localStorage.getItem('battle_res');
        var gold = parseInt(localStorage.getItem('fl_game_gold')) || 0;
        var bonusDmg = parseInt(localStorage.getItem('fl_bonus_dmg')) || 0;

        if (res === 'win') {
            document.getElementById('res-display').innerText = "🏆 ПОБЕДА СИГМЫ! +35 💰";
            document.getElementById('res-display').style.color = "#00ff66";
            gold += 35;
        } else {
            document.getElementById('res-display').innerText = "💀 СЛИВ КАТКИ! +10 💰";
            document.getElementById('res-display').style.color = "#ff3333";
            gold += 10;
        }
        localStorage.setItem('fl_game_gold', gold);
        document.getElementById('gold-display').innerText = gold;

        function buy(wName, cost, dmg) {
            if (gold < cost) { alert("Мало золота!"); return; }
            gold -= cost;
            bonusDmg += dmg;
            localStorage.setItem('fl_game_gold', gold);
            localStorage.setItem('fl_bonus_dmg', bonusDmg);
            localStorage.setItem('fl_active_weapon_name', wName);
            
            // Сохраняем в массив инвентаря
            var inv = JSON.parse(localStorage.getItem('fl_inventory_items')) || [];
            if(!inv.includes(wName)) inv.push(wName);
            localStorage.setItem('fl_inventory_items', JSON.stringify(inv));

            document.getElementById('gold-display').innerText = gold;
            alert("Куплено: " + wName);
        }
    </script>
</body>
</html>
