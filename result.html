<!DOCTYPE html>
<html lang="ru" translate="no" class="notranslate">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="google" content="notranslate">
    <title>Fluent Arena - Итоги</title>
    <style>
        :root { --bg: #02040a; --card: rgba(14, 22, 47, 0.85); --blue: #00f2fe; --purple: #9d4edd; --success: #00ff66; --danger: #ff3333; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
        body { background: radial-gradient(circle at center, #0c112b 0%, var(--bg) 100%); color: #fff; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
        .card { background: var(--card); border: 1px solid rgba(0, 242, 254, 0.3); border-radius: 28px; padding: 40px 30px; text-align: center; max-width: 460px; width: 100%; box-shadow: 0 25px 60px rgba(0, 0, 0, 0.6); }
        h1 { font-size: 2rem; font-weight: 900; color: var(--blue); letter-spacing: 2px; margin-bottom: 20px; text-shadow: 0 0 15px rgba(0,242,254,0.4); text-transform: uppercase; }
        .res-text { font-size: 1.5rem; font-weight: 900; margin-bottom: 25px; letter-spacing: 0.5px; }
        .shop { border-top: 1px solid rgba(255,255,255,0.08); margin-top: 25px; padding-top: 25px; text-align: left; }
        .shop-title { text-align: center; color: var(--purple); font-weight: 900; margin-bottom: 20px; font-size: 1.1rem; letter-spacing: 2px; text-transform: uppercase; text-shadow: 0 0 10px rgba(157,78,221,0.3); }
        .item { display: flex; justify-content: space-between; align-items: center; background: rgba(2,4,10,0.5); border: 1px solid rgba(255,255,255,0.06); padding: 14px; border-radius: 16px; margin-bottom: 12px; }
        .item h4 { font-size: 1rem; color: var(--blue); font-weight: 800; }
        .item p { font-size: 0.8rem; color: #8fa0b5; margin-top: 2px; }
        .btn-buy { background: linear-gradient(135deg, #00ff66, #11ff88); color: #02040a; border: none; padding: 10px 16px; border-radius: 10px; font-weight: 900; cursor: pointer; transition: all 0.2s; box-shadow: 0 4px 10px rgba(0,255,102,0.2); }
        .btn-buy:hover { transform: scale(1.03); filter: brightness(1.2); }
        .btn-menu { display: block; width: 100%; background: #fff; color: #02040a; border: none; padding: 16px; border-radius: 14px; font-size: 1.1rem; font-weight: 900; cursor: pointer; text-transform: uppercase; margin-top: 30px; text-decoration: none; text-align: center; letter-spacing: 1px; box-shadow: 0 4px 15px rgba(255,255,255,0.2); }
    </style>
</head>
<body>
    <div class="card">
        <h1>Раунд Завершен 🚩</h1>
        <div class="res-text" id="res-display">-</div>
        <div style="font-size: 1.1rem; font-weight: bold; margin-bottom: 5px;">Твой крипто-баланс: <span id="gold-display" style="color:#ffb703; font-weight:800; text-shadow:0 0 8px rgba(255,183,3,0.2);">0</span> 💰</div>

        <!-- РАСШИРЕННЫЙ МАГАЗИН КРУТЫХ ОРУЖИЙ -->
        <div class="shop">
            <div class="shop-title">📦 Даркнет Оружейная 📦</div>
            <div class="item">
                <div><h4>🗡️ Лопата Мортиса</h4><p>Урон +10 навсегда</p></div>
                <button class="btn-buy" onclick="buy('Лопата Мортиса 🗡️', 30, 10)">30 💰</button>
            </div>
            <div class="item">
                <div><h4>🔥 Меч Мега-Грифера</h4><p>Урон +18 навсегда</p></div>
                <button class="btn-buy" onclick="buy('Меч Грифера 🔥', 60, 18)">60 💰</button>
            </div>
            <div class="item">
                <div><h4>👑 Админка ReallyWorld</h4><p>Урон +28 навсегда</p></div>
                <button class="btn-buy" onclick="buy('Админка ReallyWorld 👑', 100, 28)">100 💰</button>
            </div>
            <div class="item">
                <div><h4>🌌 Посох Сигма-Овнера</h4><p>Урон +45 к силе атаки</p></div>
                <button class="btn-buy" onclick="buy('Посох Овнера 🌌', 160, 45)">160 💰</button>
            </div>
        </div>

        <a href="index.html" class="btn-menu">Вернуться в меню</a>
    </div>
    <script>
        var res = localStorage.getItem('battle_res');
        var gold = parseInt(localStorage.getItem('fl_game_gold')) || 0;
        var bonusDmg = parseInt(localStorage.getItem('fl_bonus_dmg')) || 0;

        if (res === 'win') {
            document.getElementById('res-display').innerText = "🎉 ПОБЕДА СИГМЫ! 🎉";
            document.getElementById('res-display').style.color = "var(--success)";
            document.getElementById('res-display').style.textShadow = "0 0 15px var(--success)";
            gold += 35; 
        } else {
            document.getElementById('res-display').innerText = "💀 КАТКА СЛИТА! 💀";
            document.getElementById('res-display').style.color = "var(--danger)";
            document.getElementById('res-display').style.textShadow = "0 0 15px var(--danger)";
            gold += 8; 
        }
        localStorage.setItem('fl_game_gold', gold);
        document.getElementById('gold-display').innerText = gold;

        function buy(wName, cost, dmg) {
            if (gold < cost) { alert("Недостаточно крипто-монет! Иди крушить боссов!"); return; }
            gold -= cost;
            bonusDmg += dmg;
            localStorage.setItem('fl_game_gold', gold);
            localStorage.setItem('fl_bonus_dmg', bonusDmg);
            localStorage.setItem('fl_active_weapon_name', wName);
            document.getElementById('gold-display').innerText = gold;
            alert("Оружие '" + wName + "' экипировано! Урон увеличен на +" + dmg);
        }
    </script>
</body>
</html>
