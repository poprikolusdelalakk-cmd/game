<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Поиск соперника</title>
    <style>
        body { background: #02040a; color: #fff; font-family: sans-serif; height: 100vh; display: flex; align-items: center; justify-content: center; text-align: center; }
        .radar { width: 90px; height: 90px; border-radius: 50%; border: 2px dashed #00f2fe; margin: 0 auto 20px auto; animation: rot 3s linear infinite; }
        @keyframes rot { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div>
        <div class="radar"></div>
        <h2 id="st">Поиск Сигма-соперника по сети...</h2>
    </div>
    <script>
        setTimeout(function() {
            document.getElementById('st').innerText = "СОПЕРНИК НАЙДЕН! ПОДКЛЮЧЕНИЕ... ⚔️";
            setTimeout(function() { window.location.href = 'arena.html'; }, 1000);
        }, 2000);
    </script>
</body>
</html>
