<!DOCTYPE html>
<html lang="ru" translate="no" class="notranslate">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fluent Arena - Поиск соперника</title>
    <style>
        :root { --bg: #02040a; --blue: #00f2fe; --purple: #9d4edd; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
        body { background: radial-gradient(circle at center, #0c112b 0%, var(--bg) 100%); color: #fff; height: 100vh; display: flex; align-items: center; justify-content: center; }
        .box { text-align: center; padding: 20px; }
        .radar-box { width: 140px; height: 140px; margin: 0 auto 35px auto; position: relative; }
        .radar { width: 100%; height: 100%; border-radius: 50%; border: 2px dashed var(--blue); position: relative; box-shadow: 0 0 30px rgba(0,242,254,0.3); animation: rotateRadar 4s linear infinite; }
        .radar-pulse { position: absolute; width: 100%; height: 100%; border-radius: 50%; border: 1px solid var(--purple); top:0; left:0; animation: pulseRadar 1.5s ease-out infinite; opacity: 0; }
        @keyframes rotateRadar { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
        @keyframes pulseRadar { 0% { transform: scale(0.6); opacity: 1; } 100% { transform: scale(1.4); opacity: 0; } }
        h3 { font-size: 1.6rem; font-weight: 900; letter-spacing: 1.5px; margin-bottom: 12px; text-transform: uppercase; }
        p { color: #8fa0b5; font-size: 1rem; font-weight: bold; }
    </style>
</head>
<body>
    <div class="box">
        <div class="radar-box">
            <div class="radar"></div>
            <div class="radar-pulse"></div>
        </div>
        <h3 id="status-text" style="color: #fff;">Поиск соперника...</h3>
        <p id="timer">Калибровка лобби: 0с</p>
    </div>
    <script>
        var sec = 0;
        var t = setInterval(function() {
            sec++;
            document.getElementById('timer').innerText = "Калибровка лобби: " + sec + "с";
            if (sec === 2) {
                document.getElementById('status-text').innerText = "СОПЕРНИК НАЙДЕН! ⚔️";
                document.getElementById('status-text').style.color = "var(--blue)";
                document.getElementById('status-text').style.textShadow = "0 0 15px var(--blue)";
            }
            if (sec >= 3) {
                clearInterval(t);
                window.location.href = 'arena.html';
            }
        }, 1000);
    </script>
</body>
</html>
