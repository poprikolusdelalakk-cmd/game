<!DOCTYPE html>
<html lang="ru" translate="no" class="notranslate">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Выбор Сигмы</title>
    <style>
        :root { --bg: #02040a; --card: rgba(14, 22, 47, 0.75); --blue: #00f2fe; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
        body { background: radial-gradient(circle at center, #0c112b 0%, var(--bg) 100%); color: #fff; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
        .container { max-width: 480px; width: 100%; text-align: center; }
        h2 { font-size: 1.6rem; margin-bottom: 25px; text-transform: uppercase; letter-spacing: 1px; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        .char-btn { background: var(--card); border: 1px solid rgba(0, 242, 254, 0.2); border-radius: 16px; padding: 18px; color: #fff; cursor: pointer; text-align: left; transition: 0.2s; }
        .char-btn:hover { border-color: var(--blue); background: rgba(0, 242, 254, 0.05); transform: translateY(-2px); }
        .char-btn h3 { font-size: 1.1rem; color: var(--blue); margin-bottom: 4px; }
        .char-btn p { font-size: 0.75rem; color: #8fa0b5; }
    </style>
</head>
<body>
    <div class="container">
        <h2>Выбери своего Сигму:</h2>
        <div class="grid">
            <button class="char-btn" onclick="select('Nazar', 150, 20)"><h3>Nazar (Овнер)</h3><p>HP: 150 | Атак: 20<br>Пассивка: Крит 30%</p></button>
            <button class="char-btn" onclick="select('Leon', 110, 26)"><h3>Леон (Бравл)</h3><p>HP: 110 | Атак: 26<br>Пассивка: Стелс-реген</p></button>
            <button class="char-btn" onclick="select('Domer', 130, 22)"><h3>Домер (Грифер)</h3><p>HP: 130 | Атак: 22<br>Пассивка: Пробой брони</p></button>
            <button class="char-btn" onclick="select('Mellstroy', 120, 18)"><h3>Меллстрой</h3><p>HP: 120 | Атак: 18<br>Пассивка: Имба щит</p></button>
        </div>
    </div>
    <script>
        function select(name, hp, dmg) {
            localStorage.setItem('p_name', name);
            localStorage.setItem('p_hp', hp);
            localStorage.setItem('p_max_hp', hp);
            localStorage.setItem('p_dmg', dmg);
            window.location.href = 'search.html';
        }
    </script>
</body>
</html>
